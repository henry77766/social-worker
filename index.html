// ── 國定假日查詢（使用下方 TAIWAN_HOLIDAYS 陣列，由行事曆元件定義）──
const holidayCache = {};
async function fetchHolidays(year){
  if(holidayCache[year])return holidayCache[year];
  // TAIWAN_HOLIDAYS 定義於行事曆元件附近，此處動態取得
  const src=typeof TAIWAN_HOLIDAYS!=="undefined"?TAIWAN_HOLIDAYS:[];
  const map={};
  src.forEach(h=>{
    if(h.date&&h.date.startsWith(String(year)))map[h.date]=h.title;
  });
  holidayCache[year]=map;
  return map;
}

// Hook: 取得某日期範圍的假日
function useHolidays(years){
  const [holidays,setHolidays]=useState({});
  useEffect(()=>{
    let cancelled=false;
    Promise.all(years.map(y=>fetchHolidays(y))).then(results=>{
      if(cancelled)return;
      const merged=Object.assign({},...results);
      setHolidays(merged);
    });
    return()=>{cancelled=true;};
  },[years.join(",")]);
  return holidays;
}

// 取得日期的假日名稱（若非假日則回傳 null）
function getHolidayName(dateStr,holidays){
  return holidays[dateStr]||null;
}

function calcAgeYears(birthDate){
  if(!birthDate)return null;
  const bd=new Date(birthDate+"T00:00:00");
  if(isNaN(bd))return null;
  const now=new Date();
  let y=now.getFullYear()-bd.getFullYear();
  const m=now.getMonth()-bd.getMonth();
  if(m<0||(m===0&&now.getDate()<bd.getDate()))y--;
  return y<0?null:y;
}
function calcAgeFromDate(birthDate){
  if(!birthDate)return"";
  const bd=new Date(birthDate+"T00:00:00");
  if(isNaN(bd))return"";
  const now=new Date();
  let years=now.getFullYear()-bd.getFullYear();
  let months=now.getMonth()-bd.getMonth();
  if(now.getDate()<bd.getDate())months--;
  if(months<0){years--;months+=12;}
  if(years<0)return"";
  return months>0?`${years}歲${months}個月`:`${years}歲`;
}

// 民國年月日 → 西元日期字串 YYYY-MM-DD
function rocToAD(rocYear,month,day){
  if(!rocYear)return"";
  const y=parseInt(rocYear)+1911;
  const m=String(parseInt(month)||1).padStart(2,"0");
  const d=String(parseInt(day)||1).padStart(2,"0");
  return`${y}-${m}-${d}`;
}

function fmtDate(d){if(!d)return"";const dt=new Date(d+"T00:00:00");return`${dt.getFullYear()-1911}/${dt.getMonth()+1}/${dt.getDate()}`;}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement("script");
    s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

// Firebase CRUD helpers
// ── 舊資料搬移（一次性，僅限第一位原始使用者）────────────────────
async function migrateOldData(){
  if(!db)return false;
  const uid=getUid();
  if(!uid)return false;

  // 全域標記：若已有人完成搬移，其他人跳過
  const metaDoc=await db.collection("_meta").doc("migration").get();
  if(metaDoc.exists)return false;

  // 檢查新路徑是否已有資料
  const checkSnap=await db.collection("users").doc(uid).collection("cases").limit(1).get();
  if(!checkSnap.empty)return false;

  // 檢查舊路徑是否有資料
  const COLS=["cases","visits","resources","diary","events","caseRecords","levelHistory"];
  let hasOld=false;
  for(const col of COLS){
    const snap=await db.collection(col).limit(1).get();
    if(!snap.empty){hasOld=true;break;}
  }
  if(!hasOld)return false;

  // 開始搬移
  const batch=db.batch();
  let count=0;
  for(const col of COLS){
    const snap=await db.collection(col).get();
    snap.docs.forEach(doc=>{
      const newRef=db.collection("users").doc(uid).collection(col).doc(doc.id);
      batch.set(newRef,doc.data());
      count++;
    });
  }
  // 寫入全域標記，防止其他用戶重複搬移
  batch.set(db.collection("_meta").doc("migration"),{
    migratedBy:uid,date:new Date().toISOString(),count
  });
  if(count>0)await batch.commit();
  return count>0;
}

// 取得目前登入者的 uid
function getUid(){
  try{return firebase.auth().currentUser?.uid||null;}catch{return null;}
}
// 資料路徑：users/{uid}/{collection}，無 uid 時 fallback 到舊路徑
function userCol(collection){
  const uid=getUid();
  return uid?db.collection("users").doc(uid).collection(collection):db.collection(collection);
}
async function fbGet(collection){
  if(!db)return[];
  const snap=await userCol(collection).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function fbSave(collection,item){
  if(!db)return;
  const {id,...data}=item;
  await userCol(collection).doc(id).set(data);
}
async function fbDelete(collection,id){
  if(!db)return;
  await userCol(collection).doc(id).delete();
}

// ── 全部資料備份（匯出 JSON）─────────────────────────────────────
const BACKUP_COLS=["cases","visits","resources","diary","events","caseRecords","levelHistory","resourceMap","consultations"];
async function exportBackup(){
  if(!db)throw new Error("尚未連線雲端");
  const data={},counts={};
  let total=0;
  for(const col of BACKUP_COLS){
    const rows=await fbGet(col);
    data[col]=rows;
    counts[col]=rows.length;
    total+=rows.length;
  }
  const payload={version:1,exportedAt:new Date().toISOString(),uid:getUid(),counts,data};
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  const stamp=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`社工工作站備份_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  return total;
}

// ── LOGIN SCREEN ─────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [remember,setRemember]=useState(true);
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);

  const handleLogin=async()=>{
    if(!email.trim()||!password.trim()){setError("請輸入帳號與密碼");return;}
    setLoading(true);setError("");
    try{
      const persistence=remember
        ?firebase.auth.Auth.Persistence.LOCAL    // 關閉瀏覽器後仍保持登入
        :firebase.auth.Auth.Persistence.SESSION; // 關閉分頁後自動登出
      await firebase.auth().setPersistence(persistence);
      await firebase.auth().signInWithEmailAndPassword(email.trim(),password);
      onLogin();
    }catch(e){
      const msgs={"auth/user-not-found":"找不到此帳號","auth/wrong-password":"密碼錯誤","auth/invalid-email":"電子信箱格式不正確","auth/too-many-requests":"嘗試次數過多，請稍後再試","auth/invalid-credential":"帳號或密碼錯誤"};
      setError(msgs[e.code]||"登入失敗，請確認帳號密碼");
    }finally{setLoading(false);}
  };

  const handleKey=e=>{if(e.key==="Enter")handleLogin();};

  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.bg,fontFamily:font}}>
      <div style={{background:C.card,borderRadius:20,border:`1px solid ${C.border}`,padding:"48px 40px",width:"min(400px,92vw)",boxShadow:"0 8px 40px rgba(0,0,0,0.10)"}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{fontSize:11,color:C.muted,letterSpacing:"0.18em",fontWeight:500,marginBottom:10}}>SOCIAL WORKER</div>
          <div style={{fontSize:24,fontWeight:700,fontFamily:serif,color:C.text,marginBottom:6}}>社工工作站</div>
          <div style={{fontSize:13,color:C.muted}}>中正萬華・身心障礙者服務中心</div>
        </div>
        <div style={{marginBottom:16}}>
          <Label>電子信箱</Label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey} placeholder="example@gmail.com" style={inp()} autoComplete="username"/>
        </div>
        <div style={{marginBottom:16}}>
          <Label>密碼</Label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={handleKey} placeholder="輸入密碼" style={inp()} autoComplete="current-password"/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24,cursor:"pointer"}} onClick={()=>setRemember(v=>!v)}>
          <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${remember?C.primary:C.border}`,background:remember?C.primary:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.15s"}}>
            {remember&&<span style={{color:"#fff",fontSize:12,lineHeight:1}}>✓</span>}
          </div>
          <span style={{fontSize:13,color:C.muted,userSelect:"none"}}>記住我（關閉瀏覽器後維持登入）</span>
        </div>
        {error&&<div style={{background:"#FFF0F0",border:`1px solid #ECC8C8`,borderRadius:8,padding:"10px 14px",fontSize:13,color:C.danger,marginBottom:16}}>{error}</div>}
        <Btn onClick={handleLogin} style={{width:"100%",padding:"12px",fontSize:15,opacity:loading?0.7:1}} disabled={loading}>
          {loading?"登入中...":"登入"}
        </Btn>
        <div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:20,lineHeight:1.7}}>

    match /{document=**} {
      allow read, write: if true;
    }
  }
}`}
                </pre>
              )}
            </div>
          </div>
        ))}

        <div style={{background:"#FFF8ED",border:`1px solid #F0D8A8`,borderRadius:10,padding:"12px 16px",fontSize:12,color:"#7A5A20",lineHeight:1.7}}>
          ⏱️ 整個設定大約需要 10 分鐘。完成後，手機、平板、任何裝置打開網址，資料都會自動同步。
        </div>
      </div>
    </div>
  );
}

function parseExcelDate(val){
  if(!val&&val!==0)return"";
  if(typeof val==="string"){const s=val.trim();const roc=s.match(/^(\d{2,3})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);if(roc){const y=parseInt(roc[1])+1911,m=roc[2].padStart(2,"0"),d=roc[3].padStart(2,"0");return`${y}-${m}-${d}`;}const ad=s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);if(ad)return`${ad[1]}-${ad[2].padStart(2,"0")}-${ad[3].padStart(2,"0")}`;return s;}
  if(typeof val==="number"){const d=new Date(Math.round((val-25569)*86400*1000));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;}
  return String(val);
}

// 解析新制障別：回傳 {type, detail}
function parseDisabilityType(val){
  if(!val)return{type:"",detail:""};
  const s=String(val).trim();
  const found=[];
  for(let i=1;i<=8;i++){if(s.includes(String(i)))found.push(i);}
  if(found.length===0)return{type:s,detail:""};
  if(found.length>=2)return{type:"多重障",detail:found.map(n=>"第"+n+"類").join("＋")};
  return{type:"第"+found[0]+"類",detail:""};
}

function ExcelImporter({onImport,onClose}){
  const [step,setStep]=useState("upload");
  const [headers,setHeaders]=useState([]);
  const [rows,setRows]=useState([]);
  const [mapping,setMapping]=useState({});
  const [loading,setLoading]=useState(false);
  const [fileName,setFileName]=useState("");

  const loadXLSX=()=>new Promise((res,rej)=>{if(window.XLSX){res(window.XLSX);return;}const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("載入失敗"));document.head.appendChild(s);});

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setLoading(true);setFileName(file.name);
    try{
      const XLSX=await loadXLSX();
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      if(json.length<2){alert("Excel 內容不足");setLoading(false);return;}
      const hdrs=json[0].map(h=>String(h).trim());
      const data=json.slice(1).filter(r=>r.some(v=>v!==""));
      setHeaders(hdrs);setRows(data);
      const auto={};
      FIELD_DEFS.forEach(({key})=>{const kws=AUTO_MATCH[key]||[];const idx=hdrs.findIndex(h=>kws.some(k=>h.includes(k)));if(idx>=0)auto[key]=String(idx);});
      setMapping(auto);setStep("map");
    }catch(err){alert("讀取失敗："+err.message);}
    setLoading(false);
  };

  const preview=rows.slice(0,3).map(r=>Object.fromEntries(FIELD_DEFS.map(({key})=>[key,mapping[key]!=null&&mapping[key]!==""?String(r[parseInt(mapping[key])]??""):""])));

  const DATE_KEYS=new Set(["caseInDate","assignDate","evalDueDate","openDate"]);
  const doImport=()=>{
    if(!mapping["name"]){alert("請先對應「姓名」欄位");return;}
    const imported=rows.map(r=>{
      const c={id:uid(),name:"",caseNo:"",idNo:"",status:"開案中",source:"",referralUnit:"",gender:"",birthDate:"",age:"",disabilityType:"",disabilitySub:"",disabilityLevel:"",disabilityDetail:"",registeredAddr:"",addr:"",livingStatus:"",livingAlone:"",elderlyCouple:"",mainWorker:"莊子昂",caseInDate:"",assignDate:"",evalDueDate:"",openDate:toDay(),systemLevel:"",initialLevel:"",changeLevel:"",phone:"",phone2:"",emergencyContact:"",emergencyPhone:"",emergencyRelation:"",note:""};
      FIELD_DEFS.forEach(({key})=>{if(mapping[key]!=null&&mapping[key]!==""){const val=r[parseInt(mapping[key])];if(DATE_KEYS.has(key)){c[key]=parseExcelDate(val);}
          else if(key==="disabilityType"){const r=parseDisabilityType(val);c.disabilityType=r.type;c.disabilityDetail=r.detail;}
          else{c[key]=val!=null?String(val).trim():"";}}});
      return c;
    }).map(c=>{if(c.birthDate)c.age=calcAgeFromDate(c.birthDate);return c;}).filter(c=>c.name?.trim());
    if(imported.length===0){alert("找不到有效個案");return;}
    onImport(imported);
  };

  const Overlay=({children})=>(
    <div style={{position:"fixed",inset:0,background:"rgba(26,51,50,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"min(700px,95vw)",maxHeight:"88vh",overflow:"auto",boxShadow:"0 24px 64px rgba(0,0,0,0.3)"}}>{children}</div>
    </div>
  );
  const MHead=({title,sub})=>(
    <div style={{padding:"24px 28px 18px",borderBottom:`1px solid ${C.border}`,marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:16,fontWeight:700,color:C.text,fontFamily:serif}}>{title}</div>{sub&&<div style={{fontSize:12,color:C.muted,marginTop:4}}>{sub}</div>}</div>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:C.muted}}>✕</button>
      </div>
    </div>
  );

  if(step==="upload")return(<Overlay><MHead title="從 Excel 匯入個案" sub="支援 .xlsx 格式，第一列需為欄位標題"/><div style={{padding:"0 28px 32px"}}><label style={{display:"block",border:`2px dashed ${C.border}`,borderRadius:12,padding:"52px 24px",textAlign:"center",cursor:"pointer",background:C.cardAlt}}><div style={{fontSize:40,marginBottom:14}}>📂</div><div style={{fontSize:15,fontWeight:600,color:C.text,marginBottom:6}}>點擊選擇 Excel 檔案</div><div style={{fontSize:12,color:C.muted}}>支援 .xlsx</div><input type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}}/></label>{loading&&<div style={{textAlign:"center",color:C.muted,marginTop:16,fontSize:13}}>⏳ 讀取中...</div>}</div></Overlay>);

  if(step==="map")return(<Overlay><MHead title="對應 Excel 欄位" sub={`「${fileName}」共 ${rows.length} 筆，請確認欄位對應`}/><div style={{padding:"0 28px 28px"}}><div style={{background:"#E8F5E9",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#2E7D32",marginBottom:18}}>✅ 已自動辨識 {Object.values(mapping).filter(v=>v!=="").length} 個欄位</div><div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 20px",marginBottom:20}}>{FIELD_DEFS.map(({key,label,required})=>(<div key={key}><Label>{label}{required?" *":""}</Label><select value={mapping[key]??""} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))} style={inp()}><option value="">（不匯入）</option>{headers.map((h,i)=><option key={i} value={String(i)}>{h}</option>)}</select></div>))}</div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}><Btn onClick={()=>setStep("preview")}>預覽資料 →</Btn><Btn variant="secondary" onClick={()=>setStep("upload")}>重新選檔</Btn><Btn variant="secondary" onClick={onClose}>取消</Btn></div></div></Overlay>);

  if(step==="preview"){
    const mapped=FIELD_DEFS.filter(f=>mapping[f.key]);
    return(<Overlay><MHead title="確認匯入" sub={`共 ${rows.length} 筆，預覽前 3 筆`}/><div style={{padding:"0 28px 28px"}}><div style={{overflowX:"auto",marginBottom:20,borderRadius:10,border:`1px solid ${C.border}`}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:C.cardAlt}}>{mapped.map(f=><th key={f.key} style={{padding:"10px 12px",textAlign:"left",borderBottom:`1px solid ${C.border}`,color:C.muted,fontWeight:600,whiteSpace:"nowrap"}}>{f.label}</th>)}</tr></thead><tbody>{preview.map((row,i)=>(<tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>{mapped.map(f=><td key={f.key} style={{padding:"10px 12px",color:C.text,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row[f.key]||<span style={{color:C.border}}>—</span>}</td>)}</tr>))}</tbody></table></div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}><Btn variant="accent" onClick={doImport}>✓ 匯入 {rows.length} 筆個案</Btn><Btn variant="secondary" onClick={()=>setStep("map")}>← 返回修改</Btn><Btn variant="secondary" onClick={onClose}>取消</Btn></div></div></Overlay>);
  }
  return null;
}

// ── SHARED FORM ROW (defined outside components to prevent focus loss) ──
function FormRow({label, field, type="text", opts, span=1, value, onChange}){
  return(
    <div style={{gridColumn:`span ${span}`}}>
      <label style={{fontSize:12,color:"#7A7268",display:"block",marginBottom:4,fontWeight:500}}>{label}</label>
      {opts
        ? <select value={value||""} onChange={e=>onChange(field,e.target.value)}
            style={{width:"100%",padding:"8px 12px",border:"1px solid #E0D8CF",borderRadius:8,fontSize:14,fontFamily:"'Noto Sans TC',sans-serif",color:"#252220",background:"#FAFAF7",outline:"none",boxSizing:"border-box"}}>
            {opts.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        : <input type={type} value={value||""} onChange={e=>onChange(field,e.target.value)}
            style={{width:"100%",padding:"8px 12px",border:"1px solid #E0D8CF",borderRadius:8,fontSize:14,fontFamily:"'Noto Sans TC',sans-serif",color:"#252220",background:"#FAFAF7",outline:"none",boxSizing:"border-box"}}/>
      }
    </div>
  );
}

// ── 障別欄位（大類 + 細分 / 多重障複選）─────────────────────────
function DisabilityFields({form, fld}){
  const [pickCat,setPickCat]=useState("");
  const [pickSub,setPickSub]=useState("");
  const isMulti=form.disabilityType==="多重障";
  const subs=DISABILITY_SUBS[form.disabilityType]||[];
  const chosen=(form.disabilityDetail||"").split("＋").filter(Boolean);

  const addSub=(v)=>{
    if(!v)return;
    if(!chosen.includes(v)) fld("disabilityDetail",[...chosen,v].join("＋"));
    setPickCat("");setPickSub("");
  };
  const removeSub=(v)=>fld("disabilityDetail",chosen.filter(x=>x!==v).join("＋"));

  return(
    <div>
      <Label>新制障別</Label>
      <select value={form.disabilityType||""} onChange={e=>{
        fld("disabilityType",e.target.value);
        fld("disabilityDetail","");
        fld("disabilitySub","");
        setPickCat("");setPickSub("");
      }} style={inp()}>
        {DISABILITY_TYPES.map(o=><option key={o} value={o}>{o}</option>)}
      </select>

      {!isMulti&&subs.length>0&&(
        <div style={{marginTop:8}}>
          <Label>細分障別</Label>
          <select value={form.disabilitySub||""} onChange={e=>fld("disabilitySub",e.target.value)} style={inp()}>
            <option value="">（未選）</option>
            {subs.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      )}

      {isMulti&&(
        <div style={{marginTop:8}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:6}}>加入障別（選完即加入，可重複加）：</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
            <select value={pickCat} onChange={e=>{setPickCat(e.target.value);setPickSub("");}}
              style={{...inp(),fontSize:13,width:"auto",flex:"1 1 90px"}}>
              <option value="">選類別...</option>
              {DISABILITY_CATS.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
            <select value={pickSub} onChange={e=>addSub(e.target.value)} disabled={!pickCat}
              style={{...inp(),fontSize:13,width:"auto",flex:"2 1 160px",opacity:pickCat?1:0.5}}>
              <option value="">選障別...</option>
              {(DISABILITY_SUBS[pickCat]||[]).map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
          {chosen.length>0&&(
            <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:6}}>
              {chosen.map(v=>(
                <span key={v} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,background:C.cardAlt,border:`1px solid ${C.border}`,fontSize:12,color:C.text}}>
                  {v}
                  <span onClick={()=>removeSub(v)} style={{cursor:"pointer",color:C.muted,fontWeight:700}}>✕</span>
                </span>
              ))}
            </div>
          )}
          {chosen.length===0&&<div style={{fontSize:11,color:C.muted,marginTop:6}}>尚未選擇</div>}
        </div>
      )}
    </div>
  );
}

function CaseList({data,setData,onSave,onDelete}){
  const blank={name:"",caseNo:"",idNo:"",status:"開案中",source:"",referralUnit:"",gender:"",birthDate:"",age:"",disabilityType:"",disabilitySub:"",disabilityLevel:"",disabilityDetail:"",registeredAddr:"",addr:"",livingStatus:"",livingAlone:"",elderlyCouple:"",mainWorker:"莊子昂",caseInDate:"",assignDate:"",evalDueDate:"",openDate:toDay(),systemLevel:"",initialLevel:"",changeLevel:"",phone:"",phone2:"",emergencyContact:"",emergencyPhone:"",emergencyRelation:"",note:""};
  const [showForm,setShowForm]=useState(false);
  const [showIntake,setShowIntake]=useState(false);
  const [showImport,setShowImport]=useState(false);

  const fld=(k,v)=>setForm(f=>{
    const next={...f,[k]:v};
    if(k==="birthDate")next.age=calcAgeFromDate(v);
    return next;
  });
  const save=async()=>{
    if(!form.name.trim()){alert("請填寫姓名");return;}
    const newCase={...form,id:uid()};
    setData(d=>({...d,cases:[...d.cases,newCase]}));
    await onSave("cases",newCase);
    setForm(blank);setShowForm(false);
  };
  const del=async id=>{
    if(!confirm("確定刪除此個案？"))return;
    setData(d=>({...d,cases:d.cases.filter(c=>c.id!==id)}));
    await onDelete("cases",id);
    setExpanded(null);
  };
  const saveEdit=async(updated)=>{
    // 自動偵測等級變動
    const prev=data.cases.find(c=>c.id===updated.id);
    const levelFields=["systemLevel","initialLevel","changeLevel"];
    const changes=[];
    levelFields.forEach(f=>{
      if(prev&&prev[f]&&updated[f]&&prev[f]!==updated[f]){
        changes.push({field:f,from:prev[f],to:updated[f]});
      }
    });
    if(changes.length>0){
      for(const ch of changes){
        const record={
          id:uid(),caseId:updated.id,caseName:updated.name,
          date:toDay(),field:ch.field,from:ch.from,to:ch.to,
          note:"",auto:true
        };
        setData(d=>({...d,levelHistory:[...(d.levelHistory||[]),record]}));
        await onSave("levelHistory",record);
      }
    }
    setData(d=>({...d,cases:d.cases.map(c=>c.id===updated.id?updated:c)}));
    await onSave("cases",updated);
  };
  const bulkDelete=async()=>{
    if(selectedIds.size===0)return;
    if(!confirm(`確定刪除選取的 ${selectedIds.size} 個個案？此操作無法復原。`))return;
    setData(d=>({...d,cases:d.cases.filter(c=>!selectedIds.has(c.id))}));
    for(const id of selectedIds)await onDelete("cases",id);
    setSelectedIds(new Set());
    setSelectMode(false);
  };
  const toggleSelect=(id)=>{
    setSelectedIds(prev=>{
      const next=new Set(prev);
      next.has(id)?next.delete(id):next.add(id);
      return next;
    });
  };
  const toggleAll=()=>{
    if(selectedIds.size===filtered.length){setSelectedIds(new Set());}
    else{setSelectedIds(new Set(filtered.map(c=>c.id)));}
  };
  const handleImport=async(imported)=>{
    let addCount=0,updateCount=0;
    const updatedCases=[...data.cases];
    for(const c of imported){
      // 以身分證字號比對
      const idNo=(c.idNo||"").trim().toUpperCase();
      const existIdx=idNo?updatedCases.findIndex(x=>(x.idNo||"").trim().toUpperCase()===idNo):-1;
      if(existIdx>=0){
        // 更新：保留原 id，合併其他欄位（空值不覆蓋）
        const merged={...updatedCases[existIdx]};
        Object.keys(c).forEach(k=>{
          if(k==="id")return;
          if(c[k]!==undefined&&c[k]!==null&&String(c[k]).trim()!==""){
            merged[k]=c[k];
          }
        });
        updatedCases[existIdx]=merged;
        await onSave("cases",merged);
        updateCount++;
      }else{
        // 新增
        updatedCases.push(c);
        await onSave("cases",c);
        addCount++;
      }
    }
    setData(d=>({...d,cases:updatedCases}));
    setShowImport(false);
    const msg=[];
    if(updateCount>0)msg.push(`更新 ${updateCount} 筆`);
    if(addCount>0)msg.push(`新增 ${addCount} 筆`);
    setImportMsg("✅ 匯入完成："+msg.join("、")+"！");
    setTimeout(()=>setImportMsg(null),6000);
  };

  // 找出重複個案
  const duplicateGroups=[];
  if(showDuplicates){
    const byIdNo={};const byName={};const byCaseNo={};
    (data.cases||[]).forEach(c=>{
      const idNo=(c.idNo||"").trim().toUpperCase();
      const name=(c.name||"").trim();
      const caseNo=(c.caseNo||"").trim().toUpperCase();
      const birth=(c.birthDate||"").trim();
      if(idNo){byIdNo[idNo]=byIdNo[idNo]||[];byIdNo[idNo].push(c);}
      if(name&&birth){const k=name+"|"+birth;byName[k]=byName[k]||[];byName[k].push(c);}
      else if(name&&!idNo){byName[name]=byName[name]||[];byName[name].push(c);}
      if(caseNo){byCaseNo[caseNo]=byCaseNo[caseNo]||[];byCaseNo[caseNo].push(c);}
    });
    const seen=new Set();
    Object.entries(byIdNo).forEach(([k,arr])=>{
      if(arr.length>1){
        const ids=arr.map(c=>c.id).sort().join(",");
        if(!seen.has(ids)){seen.add(ids);duplicateGroups.push({reason:"身分證字號相同",key:k,cases:arr});}
      }
    });
    Object.entries(byName).forEach(([k,arr])=>{
      if(arr.length>1){
        const ids=arr.map(c=>c.id).sort().join(",");
        if(!seen.has(ids)){seen.add(ids);duplicateGroups.push({reason:k.includes("|")?"姓名+生日相同":"姓名相同（無身分證可比對）",key:k,cases:arr});}
      }
    });
    Object.entries(byCaseNo).forEach(([k,arr])=>{
      if(arr.length>1){
        const ids=arr.map(c=>c.id).sort().join(",");
        if(!seen.has(ids)){seen.add(ids);duplicateGroups.push({reason:"案號相同",key:k,cases:arr});}
      }
    });
  }

  const filtered=data.cases.filter(c=>(statusFilter==="all"||c.status===statusFilter)&&(c.name?.includes(search)||c.caseNo?.includes(search)||c.addr?.includes(search)||c.idNo?.includes(search)||c.disabilityType?.includes(search)));
  const stColor={"開案中":C.primary,"結案":C.muted,"待評估":"#4A6E8A","列管中":"#8B6DB8"};
  // FRow moved outside as FormRow to prevent focus loss

  return(
    <div>
      {showImport&&<ExcelImporter onImport={handleImport} onClose={()=>setShowImport(false)}/>}
      {editCase&&<CaseEditModal caseData={editCase} onSave={saveEdit} onClose={()=>setEditCase(null)}/>}
      {viewCase&&<CaseViewModal c={viewCase} caseRecords={data.caseRecords} levelHistory={data.levelHistory} setData={setData} onSave={onSave} onDelete={onDelete} onEdit={()=>{setEditCase(viewCase);setViewCase(null);}} onClose={()=>setViewCase(null)}/>}
      {recordsCase&&<CaseRecordsModal caseData={recordsCase} caseRecords={data.caseRecords||[]} setData={setData} onSave={onSave} onDelete={onDelete} onClose={()=>setRecordsCase(null)}/>}
      {/* 聯繫資訊預覽 Modal */}
      {contactPreview&&(
        <div style={{position:"fixed",inset:0,background:"rgba(26,51,50,0.45)",zIndex:1500,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
          onClick={e=>{if(e.target===e.currentTarget)setContactPreview(null);}}>
          <div style={{background:C.card,borderRadius:16,width:"min(400px,94vw)",boxShadow:"0 16px 48px rgba(0,0,0,0.22)",overflow:"hidden"}}>
            {/* header */}
            <div style={{background:C.sidebar,padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:serif}}>{contactPreview.name}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginTop:2}}>{contactPreview.caseNo||"—"}&nbsp;·&nbsp;{contactPreview.status||""}</div>
              </div>
              <button onClick={()=>setContactPreview(null)} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>
            {/* body */}
            <div style={{padding:"20px 22px"}}>
              {/* 本人電話 */}
              <div style={{marginBottom:16}}>
                <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.06em",marginBottom:8}}>本人聯絡</div>
                {contactPreview.phone?(
                  <a href={`tel:${contactPreview.phone}`} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#F0F7F4",borderRadius:10,textDecoration:"none",color:C.text,marginBottom:6}}>
                    <span style={{fontSize:18}}>📞</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:14,color:C.primary}}>{contactPreview.phone}</div>
                      <div style={{fontSize:11,color:C.muted}}>本人電話</div>
                    </div>
                  </a>
                ):<div style={{fontSize:13,color:C.muted,padding:"8px 0"}}>（未填）</div>}
                {contactPreview.phone2&&(
                  <a href={`tel:${contactPreview.phone2}`} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:C.cardAlt,borderRadius:10,textDecoration:"none",color:C.text,border:`1px solid ${C.border}`}}>
                    <span style={{fontSize:18}}>📱</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{contactPreview.phone2}</div>
                      <div style={{fontSize:11,color:C.muted}}>備用電話</div>
                    </div>
                  </a>
                )}
              </div>
              {/* 緊急聯絡人 */}
              <div style={{borderTop:`1px solid ${C.border}`,paddingTop:16}}>
                <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:"0.06em",marginBottom:8}}>緊急聯絡人</div>
                {(contactPreview.emergencyContact||contactPreview.emergencyPhone)?(
                  <div style={{background:"#FFF8ED",border:"1px solid #F0D8A8",borderRadius:10,padding:"12px 14px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <span style={{fontWeight:600,fontSize:14,color:C.text}}>{contactPreview.emergencyContact||"（姓名未填）"}</span>
                      {contactPreview.emergencyRelation&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#F0D8A8",color:"#7A5A20"}}>{contactPreview.emergencyRelation}</span>}
                    </div>
                    {contactPreview.emergencyPhone&&(
                      <a href={`tel:${contactPreview.emergencyPhone}`} style={{display:"flex",alignItems:"center",gap:8,textDecoration:"none",color:C.primary,fontWeight:600,fontSize:14}}>
                        <span>📞</span>{contactPreview.emergencyPhone}
                      </a>
                    )}
                  </div>
                ):<div style={{fontSize:13,color:C.muted,padding:"8px 0"}}>（未填）</div>}
              </div>
              {/* 地址 */}
              {(contactPreview.registeredAddr||contactPreview.addr)&&(
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14,marginTop:2}}>

                    {contactPreview.registeredAddr&&<div style={{fontSize:13,color:C.text,lineHeight:1.6}}>🏠 <span style={{color:C.muted,fontSize:11}}>戶籍</span>　{contactPreview.registeredAddr}</div>}
                    {contactPreview.addr&&<div style={{fontSize:13,color:C.text,lineHeight:1.6}}>📍 <span style={{color:C.muted,fontSize:11}}>居住</span>　{contactPreview.addr}</div>}

            </div>
            <div style={{padding:"12px 22px 18px",display:"flex",gap:8,justifyContent:"flex-end"}}>

              <Btn onClick={()=>{setEditCase(contactPreview);setContactPreview(null);}}>✏️ 編輯個案</Btn>
            </div>
          </div>
        </div>

            {showMore&&(
              <>
                <div onClick={()=>setShowMore(false)} style={{position:"fixed",inset:0,zIndex:20}}/>

                    {label:selectMode?"取消選取":"☑ 批次刪除", active:selectMode,
                     fn:()=>{setSelectMode(v=>!v);setSelectedIds(new Set());}},
                  ].map(it=>(
                    <div key={it.label} onClick={()=>{it.fn();setShowMore(false);}}

                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>

              {selectedIds.size===filtered.length&&filtered.length>0&&<span style={{color:"#fff",fontSize:11}}>✓</span>}

            🗑 刪除選取的 {selectedIds.size} 個
          </Btn>
        </div>
      )}
      {importMsg&&<div style={{background:"#E8F5E9",border:`1px solid #A5D6A7`,borderRadius:10,padding:"12px 18px",marginBottom:16,fontSize:13,color:"#2E7D32"}}>{importMsg}</div>}
      {showDuplicates&&(
        <div style={{background:"#FFF8ED",border:"2px solid #E0B060",borderRadius:12,padding:20,marginBottom:20}}>
          <div style={{fontSize:15,fontWeight:700,color:"#7A5A20",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
            🔍 重複個案偵測
            <span style={{fontSize:12,fontWeight:500,color:C.muted,marginLeft:"auto"}}>共 {duplicateGroups.length} 組疑似重複</span>
          </div>
          {duplicateGroups.length===0
            ?<div style={{fontSize:13,color:C.muted,padding:"10px 4px"}}>✅ 未發現重複個案</div>
            :duplicateGroups.map((g,gi)=>(
              <div key={gi} style={{marginBottom:14,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"8px 14px",background:"#F0E8D5",fontSize:12,fontWeight:700,color:"#7A5A20"}}>
                  ⚠️ {g.reason}：{g.key}
                </div>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead>
                    <tr style={{background:C.cardAlt}}>
                      <th style={{padding:"6px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>姓名</th>
                      <th style={{padding:"6px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>身分證</th>
                      <th style={{padding:"6px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>案號</th>
                      <th style={{padding:"6px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>生日</th>
                      <th style={{padding:"6px 10px",textAlign:"center",color:C.muted,fontWeight:600}}>狀態</th>
                      <th style={{padding:"6px 10px",textAlign:"right",color:C.muted,fontWeight:600}}>動作</th>
                    </tr>
                  </thead>
                  <tbody>
                    {g.cases.map((cc,ci)=>(
                      <tr key={ci} style={{borderBottom:ci<g.cases.length-1?`1px solid ${C.border}`:"none"}}>
                        <td style={{padding:"8px 10px",color:C.text,fontWeight:600}}>{cc.name}</td>
                        <td style={{padding:"8px 10px",color:C.muted,fontFamily:"monospace",fontSize:12}}>{cc.idNo||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.muted}}>{cc.caseNo||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.muted,fontSize:12}}>{cc.birthDate||"—"}</td>
                        <td style={{padding:"8px 10px",textAlign:"center",fontSize:12,color:C.muted}}>{cc.status||"—"}</td>
                        <td style={{padding:"8px 10px",textAlign:"right"}}>
                          <button onClick={()=>setViewCase(cc)} style={{padding:"3px 10px",borderRadius:6,border:`1px solid ${C.border}`,background:C.card,color:C.muted,fontSize:11,cursor:"pointer",marginRight:4}}>檢視</button>
                          <button onClick={async()=>{
                            if(!confirm("確定刪除個案「"+cc.name+"」（"+(cc.caseNo||"無案號")+"）嗎？此動作無法復原。"))return;
                            setData(d=>({...d,cases:d.cases.filter(x=>x.id!==cc.id)}));
                            if(onDelete)await onDelete("cases",cc.id);
                          }} style={{padding:"3px 10px",borderRadius:6,border:"1px solid #E5C5C5",background:"#FFF4F4",color:"#C04545",fontSize:11,cursor:"pointer"}}>刪除</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ))
          }
          <div style={{fontSize:11,color:C.muted,marginTop:12,lineHeight:1.6}}>
            💡 偵測規則：身分證字號相同、姓名+生日相同、案號相同。請逐一檢查並刪除真正重複的個案。
          </div>
        </div>
      )}
      {showForm&&(<Card style={{marginBottom:20}}>
  <div style={{fontSize:14,fontWeight:600,marginBottom:16}}>新增個案</div>
  <div style={{fontSize:12,color:C.muted,marginBottom:12,fontWeight:500}}>基本資料</div>
  <div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 16px",marginBottom:16}}>
    <FormRow label="姓名 *" field="name" value={form["name"]} onChange={fld}/>

    <FormRow label="案況" field="status" value={form["status"]} onChange={fld} opts={CASE_STATUS}/>
    <FormRow label="生理性別" field="gender" value={form["gender"]} onChange={fld} opts={["","男","女","其他"]}/>
    <div>
      <Label>出生日期</Label>
      <div style={{display:"flex",gap:5,marginBottom:5}}>
        {["ad","roc"].map(t=>(
          <button key={t} type="button" onClick={()=>fld("dateInputType",t)}
            style={{flex:1,padding:"3px 0",borderRadius:6,border:`1px solid ${(form["dateInputType"]||"ad")===t?C.primary:C.border}`,background:(form["dateInputType"]||"ad")===t?"#EEF7F3":C.cardAlt,color:(form["dateInputType"]||"ad")===t?C.primary:C.muted,cursor:"pointer",fontSize:11,fontFamily:font,fontWeight:600}}>
            {t==="ad"?"西元":"民國"}
          </button>
        ))}
      </div>
      {(form["dateInputType"]||"ad")==="ad"
        ? <input type="date" value={form["birthDate"]||""} onChange={e=>fld("birthDate",e.target.value)} style={inp()}/>
        : <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input value={form["_rocY"]||""} onChange={e=>{const v=e.target.value;fld("_rocY",v);if(v)fld("birthDate",rocToAD(v,form["_rocM"],form["_rocD"]));}} placeholder="民國年" style={{...inp(),width:70,fontSize:13}}/>
            <span style={{color:C.muted,fontSize:12}}>年</span>
            <input value={form["_rocM"]||""} onChange={e=>{const v=e.target.value;fld("_rocM",v);if(form["_rocY"])fld("birthDate",rocToAD(form["_rocY"],v,form["_rocD"]));}} placeholder="月" style={{...inp(),width:50,fontSize:13}}/>
            <span style={{color:C.muted,fontSize:12}}>月</span>
            <input value={form["_rocD"]||""} onChange={e=>{const v=e.target.value;fld("_rocD",v);if(form["_rocY"])fld("birthDate",rocToAD(form["_rocY"],form["_rocM"],v));}} placeholder="日" style={{...inp(),width:50,fontSize:13}}/>
            <span style={{color:C.muted,fontSize:12}}>日</span>
          </div>

    </div>
    <div>

    <FormRow label="系統分案等級" field="systemLevel" value={form["systemLevel"]} onChange={fld}/>

  <div style={{display:"flex",gap:10,marginTop:8}}><Btn onClick={save}>儲存個案</Btn><Btn variant="secondary" onClick={()=>setShowForm(false)}>取消</Btn></div>
</Card>)}
      {/* 搜尋列 + 篩選 */}
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <input placeholder="搜尋姓名、案號、身分證、障別..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp(),maxWidth:240,flex:"0 0 auto"}}/>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{...inp(),maxWidth:120,flex:"0 0 auto"}}>
          <option value="all">全部案況</option>
          {CASE_STATUS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <span style={{fontSize:12,color:C.muted}}>{filtered.length} 個案</span>
      </div>

      {showCompleteness&&(
        <div style={{marginBottom:24}}>
          <DataCompleteness cases={(data.cases||[]).filter(c=>c.status==="開案中")} onOpenCase={c=>{setEditCase(c);}}/>
        </div>
      )}

      {/* 分類方式切換 */}
      <div style={{display:"flex",gap:0,marginBottom:20,background:C.cardAlt,borderRadius:10,border:`1px solid ${C.border}`,padding:4,width:"fit-content",flexWrap:"wrap"}}>
        {[
          {key:"none",       label:"不分類"},
          {key:"changeLevel",label:"現在等級"},
          {key:"disabilityLevel",label:"障礙等級"},
          {key:"livingAlone",label:"獨居"},
          {key:"elderlyCouple",label:"雙老"},
          {key:"ageGroup",label:"65歲以上"},
        ].map(({key,label})=>(
          <button key={key} onClick={()=>setGroupBy(key)}
            style={{padding:"6px 14px",borderRadius:7,border:"none",cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:groupBy===key?600:400,
              background:groupBy===key?C.primary:"transparent",color:groupBy===key?"#fff":C.muted,transition:"all 0.15s"}}>
            {label}
          </button>
        ))}
      </div>

      {filtered.length===0&&<div style={{color:C.muted,fontSize:14,padding:"24px 0"}}>尚無個案資料</div>}

      {/* 方塊格狀排列 — 支援分組 */}
      {(()=>{
        const CaseCard=({c})=>{
          const cVis=data.visits.filter(v=>v.caseId===c.id);
          const stBg={"開案中":"#E8F5EE","結案":"#F0F0EE","待評估":"#EAF0F8","列管中":"#F0E8FF"};
          const stDot={"開案中":C.primary,"結案":C.muted,"待評估":"#4A6E8A","列管中":"#8B6DB8"};
          return(
            <div key={c.id}
              onClick={selectMode?()=>toggleSelect(c.id):undefined}
              style={{background:C.card,borderRadius:14,border:`2px solid ${selectMode&&selectedIds.has(c.id)?C.accent:C.border}`,display:"flex",flexDirection:"column",overflow:"hidden",transition:"box-shadow 0.15s, border-color 0.15s",cursor:selectMode?"pointer":"default",position:"relative"}}
              onMouseEnter={e=>{if(!selectMode)e.currentTarget.style.boxShadow="0 4px 18px rgba(0,0,0,0.10)";}}
              onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>

              {/* 批次選取 checkbox */}
              {selectMode&&(
                <div style={{position:"absolute",top:10,right:10,zIndex:2}}>
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${selectedIds.has(c.id)?C.accent:C.border}`,background:selectedIds.has(c.id)?C.accent:"rgba(255,255,255,0.9)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.12)"}}>
                    {selectedIds.has(c.id)&&<span style={{color:"#fff",fontSize:13,fontWeight:700}}>✓</span>}
                  </div>
                </div>
              )}

              {/* 狀態色條 */}
              <div style={{height:4,background:stDot[c.status]||C.muted,borderRadius:"14px 14px 0 0"}}/>

              {/* 卡片主體 */}
              <div style={{padding:"16px 18px 12px",flex:1}}>
                {/* 姓名 + 案況 */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <span style={{fontWeight:700,fontSize:16,color:C.text,lineHeight:1.3}}>{c.name}</span>
                  <span style={{fontSize:11,fontWeight:600,color:stDot[c.status]||C.muted,background:stBg[c.status]||"#F5F5F3",padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap",marginLeft:6}}>{c.status}</span>
                </div>

                {/* 標籤列 */}
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                  {c.gender&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:C.cardAlt,color:C.muted,border:`1px solid ${C.border}`}}>{c.gender}</span>}
                  {c.disabilityLevel&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:C.cardAlt,color:C.muted,border:`1px solid ${C.border}`}}>{c.disabilityLevel}</span>}
                  {c.livingAlone==="是"&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#FFF0E0",color:"#B06020",border:"1px solid #F0D0A0"}}>獨居</span>}
                  {c.elderlyCouple==="是"&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#F0E8FF",color:"#6040A0",border:"1px solid #D8C0F0"}}>雙老</span>}
                </div>

                {/* 資訊列 */}
                <div style={{fontSize:12,color:C.muted,display:"flex",flexDirection:"column",gap:4}}>
                  {c.caseNo&&<span>📋 {c.caseNo}</span>}
                  {c.addr&&<span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍 {c.addr}</span>}
                  {(c.birthDate||c.age)&&<span>🎂 {c.birthDate?`${c.birthDate.slice(0,10)} `:""}{c.age?`${c.age}歲`:""}</span>}
                  {c.disabilityType&&<span>♿ {c.disabilityType}{c.disabilityType==="多重障"?(c.disabilityDetail?`（${c.disabilityDetail}）`:""):(c.disabilitySub?`－${c.disabilitySub}`:"")}</span>}
                  {c.changeLevel&&<span>📊 現在等級：{c.changeLevel}</span>}
                </div>
              </div>

              {/* 卡片底部 */}
              <div style={{padding:"10px 18px 14px",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:11,color:C.muted}}>
                  開案 {fmtDate(c.openDate)}　{cVis.length>0?`訪視 ${cVis.length} 筆`:""}
                </span>
                {!selectMode&&(
                  <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                    {/* 主要操作列 */}
                    <div style={{display:"flex",gap:5}}>
                      <button onClick={e=>{e.stopPropagation();setViewCase(v=>v?.id===c.id?null:c);setRecordsCase(null);}}
                        style={{padding:"5px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:viewCase?.id===c.id?"#EBEBEB":C.card,cursor:"pointer",fontSize:12,color:C.text,fontFamily:font,fontWeight:500}}>
                        🔍 檢視
                      </button>
                      <button onClick={e=>{e.stopPropagation();setEditCase(c);setViewCase(null);}}
                        style={{padding:"5px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:12,color:C.text,fontFamily:font,fontWeight:500}}>
                        ✏️ 編輯
                      </button>
                      <button onClick={e=>{e.stopPropagation();del(c.id);}}
                        style={{padding:"5px 10px",borderRadius:8,border:"1px solid #ECC8C8",background:"#FFF0F0",cursor:"pointer",fontSize:12,color:C.danger,fontFamily:font}}>
                        ✕
                      </button>
                    </div>
                    {/* 聯繫紀錄按鈕 */}
                    <button onClick={e=>{e.stopPropagation();setRecordsCase(c);}}
                      style={{padding:"5px 14px",borderRadius:8,border:`1px solid ${C.primary}`,background:"#EEF7F3",cursor:"pointer",fontSize:12,color:C.primary,fontFamily:font,fontWeight:600,display:"inline-flex",alignItems:"center",gap:6,width:"100%",justifyContent:"center"}}>
                      📋 聯繫紀錄
                      {(data.caseRecords||[]).filter(r=>r.caseId===c.id).length>0&&(
                        <span style={{background:C.primary,color:"#fff",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>
                          {(data.caseRecords||[]).filter(r=>r.caseId===c.id).length}
                        </span>
                      )}
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        if(groupBy==="none"){
          return(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
              {filtered.map(c=><CaseCard key={c.id} c={c}/>)}
            </div>
          );
        }

        // 分組顯示
        const labelMap={
          initialLevel:"個案起始等級",
          changeLevel:"現在等級",
          disabilityLevel:"障礙等級",
          livingAlone:"獨居",
          elderlyCouple:"雙老",
          ageGroup:"年齡",
        };
        const groups={};
        filtered.forEach(c=>{
          let g;
          if(groupBy==="ageGroup"){
            const y=calcAgeYears(c.birthDate);
            g = y===null ? "（未填生日）" : (y>=65 ? "65歲以上" : "65歲以下");
          }else{
            g=c[groupBy]||"（未填）";
          }
          if(!groups[g])groups[g]=[];
          groups[g].push(c);
        });
        const ORDER={
          initialLevel:["一","二","三","四","A","B","C","（未填）"],
          changeLevel:["一","二","三","四","A","B","C","（未填）"],
          disabilityLevel:["極重度","重度","中度","輕度","（未填）"],
          livingAlone:["是","否","（未填）"],
          elderlyCouple:["是","否","（未填）"],
          ageGroup:["65歲以上","65歲以下","（未填生日）"],
        };
        const order=ORDER[groupBy]||[];
        const isUnfilled=k=>k.indexOf("未填")>=0;
        const sortedKeys=[...Object.keys(groups)].sort((a,b)=>{
          // 「未填」一律排最後
          if(isUnfilled(a)!==isUnfilled(b))return isUnfilled(a)?1:-1;
          const ai=order.indexOf(a), bi=order.indexOf(b);
          if(ai>=0&&bi>=0)return ai-bi;
          if(ai>=0)return -1;
          if(bi>=0)return 1;
          return a.localeCompare(b,"zh-TW");
        });

        const groupTotal=filtered.length;
        const maxCount=Math.max(...sortedKeys.map(k=>groups[k].length),1);

        return(
          <div>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:10,paddingLeft:2}}>
              <span style={{fontSize:11,color:C.muted,letterSpacing:"0.08em"}}>依{labelMap[groupBy]}分類</span>
              <span style={{fontSize:11,color:C.border}}>·</span>
              <span style={{fontSize:11,color:C.muted}}>{groupTotal} 個案 · {sortedKeys.length} 組</span>
            </div>
            <div style={{border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",background:C.card,marginBottom:24}}>
            {sortedKeys.map((g,gi)=>{
              const gKey=groupBy+"||"+g;
              const isOpen=!!openGroups[gKey];
              const n=groups[g].length;
              const share=groupTotal?Math.round(n/groupTotal*100):0;
              const barW=Math.round(n/maxCount*100);
              const isBlankGroup=g.indexOf("未填")>=0;
              const hue=isBlankGroup?C.muted:C.primary;
              return(
              <div key={g} style={{borderTop:gi===0?"none":`1px solid ${C.border}`}}>
                <div onClick={()=>setOpenGroups(o=>({...o,[gKey]:!o[gKey]}))}
                  style={{position:"relative",display:"flex",alignItems:"center",gap:12,cursor:"pointer",userSelect:"none",
                    padding:"13px 18px",background:isOpen?"#F2F8F5":"transparent",transition:"background .15s"}}
                  onMouseEnter={e=>{if(!isOpen)e.currentTarget.style.background=C.cardAlt;}}
                  onMouseLeave={e=>{if(!isOpen)e.currentTarget.style.background="transparent";}}>
                  <div style={{position:"absolute",left:0,top:0,bottom:0,width:barW+"%",
                    background:isBlankGroup?"rgba(122,114,104,0.13)":"rgba(42,102,83,0.16)",pointerEvents:"none"}}/>
                  <span style={{position:"relative",fontSize:10,color:hue,width:10,flexShrink:0,
                    display:"inline-block",transform:isOpen?"rotate(90deg)":"none",transition:"transform .18s"}}>▶</span>
                  <span style={{position:"relative",fontFamily:serif,fontSize:16,fontWeight:600,color:hue,
                    flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g}</span>
                  <span style={{position:"relative",fontSize:11,color:C.muted,flexShrink:0,minWidth:34,textAlign:"right"}}>{share}%</span>
                  <span style={{position:"relative",display:"flex",alignItems:"baseline",gap:3,flexShrink:0,minWidth:56,justifyContent:"flex-end"}}>
                    <span style={{fontFamily:serif,fontSize:19,fontWeight:700,color:hue,lineHeight:1}}>{n}</span>
                    <span style={{fontSize:11,color:C.muted}}>個案</span>
                  </span>
                </div>
                {isOpen&&(
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14,padding:"14px 18px 20px",background:C.cardAlt}}>
                    {groups[g].map(c=><CaseCard key={c.id} c={c}/>)}
                  </div>
                )}
              </div>
              );
            })}
            </div>
          </div>
        );
      })()}
    </div>
  );
}


// ── 資料完整度 ──────────────────────────────────────────────────
const REQUIRED_FIELDS=[
  {section:"基本資料",   key:"name",           label:"姓名"},
  {section:"基本資料",   key:"caseNo",         label:"案號"},
  {section:"基本資料",   key:"idNo",           label:"身分證字號"},
  {section:"基本資料",   key:"status",         label:"案況"},
  {section:"基本資料",   key:"gender",         label:"生理性別"},
  {section:"基本資料",   key:"birthDate",      label:"出生日期"},
  {section:"基本資料",   key:"disabilityType", label:"新制障別"},
  {section:"基本資料",   key:"disabilityLevel",label:"障礙等級"},
  {section:"基本資料",   key:"changeLevel",    label:"現在等級"},
  {section:"地址與居住", key:"registeredAddr", label:"戶籍地址"},
  {section:"地址與居住", key:"addr",           label:"居住地址"},
  {section:"地址與居住", key:"livingAlone",    label:"獨居"},
  {section:"地址與居住", key:"elderlyCouple",  label:"雙老"},
];
const isBlank=v=>v===undefined||v===null||String(v).trim()==="";

function DataCompleteness({cases,onOpenCase}){
  const [expanded,setExpanded]=useState(null);
  const N=cases.length;
  if(N===0)return <Card><div style={{color:C.muted,fontSize:14}}>尚無個案資料</div></Card>;

  const stats=REQUIRED_FIELDS.map(f=>{
    const missing=cases.filter(c=>isBlank(c[f.key]));
    return {...f, filled:N-missing.length, missing, pct:Math.round((N-missing.length)/N*100)};
  });
  const totalCells=N*REQUIRED_FIELDS.length;
  const filledCells=stats.reduce((s,x)=>s+x.filled,0);
  const overall=Math.round(filledCells/totalCells*100);
  const sections=[...new Set(REQUIRED_FIELDS.map(f=>f.section))];
  const barColor=p=>p>=90?"#2A9D5C":p>=60?"#C4824A":"#C0392B";

  return(
    <div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
          <div style={{fontSize:28,fontWeight:700,color:barColor(overall)}}>{overall}%</div>
          <div style={{fontSize:13,color:C.muted}}>整體完整度 · 開案中 {N} 筆 · {REQUIRED_FIELDS.length} 個必填欄位</div>
        </div>
        <div style={{fontSize:11,color:C.muted,marginTop:6,lineHeight:1.6}}>
          僅統計案況為「開案中」的個案，以及「基本資料」與「地址與居住」欄位；待評估、結案、列管中不列入。
        </div>
      </Card>

      {sections.map(sec=>(
        <Card key={sec} style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:14}}>{sec}</div>
          {stats.filter(x=>x.section===sec).map(x=>{
            const isOpen=expanded===x.key;
            return(
              <div key={x.key} style={{marginBottom:12}}>
                <div onClick={()=>x.missing.length&&setExpanded(isOpen?null:x.key)}
                  style={{display:"flex",alignItems:"center",gap:10,cursor:x.missing.length?"pointer":"default"}}>
                  <div style={{width:96,fontSize:12,color:C.text,flexShrink:0}}>{x.label}</div>
                  <div style={{flex:1,height:8,background:C.cardAlt,borderRadius:20,overflow:"hidden",minWidth:60}}>
                    <div style={{width:x.pct+"%",height:"100%",background:barColor(x.pct),transition:"width .3s"}}/>
                  </div>
                  <div style={{width:40,textAlign:"right",fontSize:12,fontWeight:600,color:barColor(x.pct),flexShrink:0}}>{x.pct}%</div>
                  <div style={{width:96,textAlign:"right",fontSize:11,color:C.muted,flexShrink:0}}>
                    {x.missing.length>0
                      ?<span style={{color:"#C0392B"}}>{x.missing.length} 筆未填 {isOpen?"▲":"▼"}</span>
                      :<span style={{color:"#2A9D5C"}}>✓ 完整</span>}
                  </div>
                </div>
                {isOpen&&(
                  <div style={{marginTop:8,marginLeft:106,padding:"8px 12px",background:C.cardAlt,borderRadius:8,display:"flex",flexWrap:"wrap",gap:6}}>
                    {x.missing.map(c=>(
                      <span key={c.id} onClick={()=>onOpenCase(c)}
                        style={{fontSize:12,padding:"3px 10px",borderRadius:20,background:C.card,border:`1px solid ${C.border}`,cursor:"pointer",color:C.primary}}>
                        {c.name||"(未命名)"}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </Card>
      ))}
    </div>
  );
}

// ── RESOURCES ───────────────────────────────────────────────────
const RES_CATS=["長照","行政","保護","精神","醫療","就業","住宅","其他"];
function ResourceList({data,setData,onSave,onDelete}){
  const blank={name:"",cat:"其他",phone:"",addr:"",note:""};
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState(blank);
  const [search,setSearch]=useState("");
  const [catFil,setCatFil]=useState("全部");
  const fld=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=async()=>{
    if(!form.name.trim()){alert("請填寫名稱");return;}
    const r={...form,name:form.name.trim(),id:editId||uid()};
    setData(d=>({...d,resources:editId
      ?d.resources.map(x=>x.id===editId?r:x)
      :[...d.resources,r]}));
    await onSave("resources",r);
    setForm(blank);setShowForm(false);setEditId(null);
  };
  const startEdit=r=>{setForm({name:r.name||"",cat:r.cat||"其他",phone:r.phone||"",addr:r.addr||"",note:r.note||""});setEditId(r.id);setShowForm(true);window.scrollTo({top:0,behavior:"smooth"});};
  const cancelForm=()=>{setForm(blank);setShowForm(false);setEditId(null);};
  const del=async id=>{if(!confirm("確定刪除？"))return;setData(d=>({...d,resources:d.resources.filter(r=>r.id!==id)}));await onDelete("resources",id);};
  const filtered=data.resources.filter(r=>(catFil==="全部"||r.cat===catFil)&&(r.name?.includes(search)||r.phone?.includes(search)||r.note?.includes(search)));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:10}}><H1>服務資源清單</H1><Btn variant={showForm?"secondary":"primary"} onClick={()=>showForm?cancelForm():setShowForm(true)}>{showForm?"取消":"+ 新增資源"}</Btn></div>
      {showForm&&(<Card style={{marginBottom:20}}><div style={{fontSize:14,fontWeight:600,marginBottom:16}}>{editId?"編輯服務資源":"新增服務資源"}</div><div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 16px"}}>{[["name","名稱 *"],["phone","電話"],["addr","地址"]].map(([f,l])=>(<div key={f}><Label>{l}</Label><input value={form[f]} onChange={e=>fld(f,e.target.value)} style={inp()}/></div>))}<div><Label>類別</Label><select value={form.cat} onChange={e=>fld("cat",e.target.value)} style={inp()}>{RES_CATS.map(c=><option key={c}>{c}</option>)}</select></div><div style={{gridColumn:"span 2"}}><Label>備註</Label><input value={form.note} onChange={e=>fld("note",e.target.value)} style={inp()}/></div></div><div style={{display:"flex",gap:10,marginTop:16}}><Btn onClick={save}>{editId?"更新":"儲存"}</Btn><Btn variant="secondary" onClick={cancelForm}>取消</Btn></div></Card>)}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}><input placeholder="搜尋..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp(),maxWidth:200}}/>{["全部",...RES_CATS].map(c=>(<button key={c} onClick={()=>setCatFil(c)} style={{padding:"5px 14px",borderRadius:20,fontSize:12,cursor:"pointer",border:"none",fontFamily:font,background:catFil===c?C.primary:C.border,color:catFil===c?"#fff":C.text}}>{c}</button>))}</div>

    </div>
  );
}

function DiaryLog({data,setData,onSave,onDelete}){
  const [date,setDate]=useState(toDay());
  const [content,setContent]=useState("");
  const [saved,setSaved]=useState(false);
  const existing=data.diary.find(d=>d.date===date);
  const thisYear=new Date().getFullYear();
  const holidays=useHolidays([thisYear,thisYear+1]);
  const todayHoliday=getHolidayName(date,holidays);
  useEffect(()=>{setContent(existing?.content||"");setSaved(false);},[date]);
  const save=async()=>{
    const entry={date,content,id:existing?.id||uid()};
    setData(d=>{const rest=d.diary.filter(x=>x.date!==date);return content.trim()?{...d,diary:[...rest,entry]}:{...d,diary:rest};});
    if(content.trim())await onSave("diary",entry);else if(existing)await onDelete("diary",existing.id);
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  const del=async()=>{if(!confirm("確定刪除？"))return;setData(d=>({...d,diary:d.diary.filter(x=>x.date!==date)}));if(existing)await onDelete("diary",existing.id);setContent("");};
  const sorted=[...data.diary].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return(
    <div>
      <H1>工作日誌</H1>
      <div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:24}}>
        <Card>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inp(),maxWidth:180}}/>
            <span style={{fontSize:13,color:C.muted}}>{new Date(date+"T00:00:00").toLocaleDateString("zh-TW",{weekday:"long"})}</span>
            {todayHoliday&&<span style={{fontSize:12,fontWeight:600,color:"#C04040",background:"#FFF0F0",border:"1px solid #ECC8C8",padding:"3px 10px",borderRadius:20}}>🎌 {todayHoliday}</span>}
          </div>
          <textarea value={content} onChange={e=>setContent(e.target.value)} placeholder="記錄今日工作事項、訪視摘要、心得、待辦..." style={{...inp(),height:320,resize:"vertical",lineHeight:1.85}}/>
          <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16}}><Btn onClick={save}>儲存日誌</Btn>{saved&&<span style={{fontSize:12,color:C.primary}}>✓ 已儲存</span>}{existing&&<Btn variant="danger" onClick={del}>刪除</Btn>}</div>
        </Card>
        <div>
          <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:12,letterSpacing:"0.05em"}}>過去日誌</div>
          {sorted.length===0&&<div style={{fontSize:13,color:C.muted}}>尚無日誌</div>}
          <div style={{maxHeight:420,overflowY:"auto"}}>{sorted.map(d=>(<div key={d.date} onClick={()=>setDate(d.date)} style={{background:d.date===date?C.primary:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:"12px 14px",marginBottom:8,cursor:"pointer"}}><div style={{fontSize:12,fontWeight:600,color:d.date===date?"#fff":C.muted,marginBottom:3}}>{fmtDate(d.date)} {new Date(d.date+"T00:00:00").toLocaleDateString("zh-TW",{weekday:"short"})}</div><div style={{fontSize:12,color:d.date===date?"rgba(255,255,255,0.8)":C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.content}</div></div>))}</div>
        </div>
      </div>
    </div>
  );
}
