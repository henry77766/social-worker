      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:16}}>🔍</span>
        <input
          type="text"
          placeholder="搜尋個案姓名或案號…"
          value={searchQuery}
          onChange={e=>setSearchQuery(e.target.value)}
          style={{flex:1,border:"none",outline:"none",fontSize:14,background:"transparent",color:C.text,fontFamily:font}}
        />
        {searchQuery&&<button onClick={()=>setSearchQuery("")} style={{background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:13,padding:"0 4px"}}>✕</button>}
      </div>

      {/* 聯繫方式統計 */}
      {Object.keys(byMethod).length>0&&(
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"16px 20px",marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:700,color:C.muted,letterSpacing:"0.06em",marginBottom:10}}>聯繫方式分布</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {Object.entries(byMethod).sort((a,b)=>b[1]-a[1]).map(([m,n])=>(
              <div key={m} onClick={()=>setFilterMethod(f=>f===m?null:m)}
                style={{padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:600,
                  background:filterMethod===m?C.primary:"#EEF7F3",
                  border:`1px solid ${C.primary}`,
                  color:filterMethod===m?"#fff":C.primary,
                  transition:"all 0.15s"}}>
                {m} <span style={{fontWeight:700}}>{n}</span> 次
                {filterMethod===m&&<span style={{marginLeft:5,opacity:0.7}}>✕</span>}
              </div>
            ))}
          </div>
          {filterMethod&&<div style={{fontSize:11,color:C.muted,marginTop:8}}>
            {"顯示「"+filterMethod+"」的 "+records.filter(r=>r.contactMethod===filterMethod).length+" 筆紀錄"} <button onClick={()=>setFilterMethod(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.primary,fontSize:11,padding:0,marginLeft:4}}>清除篩選</button>
          </div>}
        </div>
      )}

      {/* 條列式紀錄 */}
      {records.length===0
        ? <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"40px",textAlign:"center",color:C.muted,fontSize:14}}>
            {MONTH_NAMES[month-1]}無聯繫紀錄
          </div>
        : <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
            <div style={{padding:"12px 20px",background:C.cardAlt,borderBottom:`1px solid ${C.border}`,display:"grid",gridTemplateColumns:"90px 80px 90px 70px 1fr auto",gap:8,fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.04em"}}>
              <span>日期</span><span>個案</span><span>聯繫對象</span><span>方式／次數</span><span>內容</span><span></span>
            </div>
            {(filterMethod||searchQuery?records.filter(r=>(filterMethod?r.contactMethod===filterMethod:true)&&(searchQuery?(caseName(r.caseId).includes(searchQuery)||(caseNo(r.caseId).includes(searchQuery))):true)):records).map((r,i)=>(
              editId===r.id
              ? <div key={r.id} style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}`,background:"#F8F5F0",display:"flex",flexDirection:"column",gap:10,borderLeft:`3px solid ${C.accent}`}}>
                  <div style={{fontSize:12,fontWeight:600,color:C.accent,marginBottom:2}}>編輯紀錄 — {caseName(r.caseId)}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 14px"}}>
                    <div>
                      <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>日期</label>
                      <input type="date" value={editRec.date||""} onChange={e=>fldEdit("date",e.target.value)} style={{...inp(),fontSize:13}}/>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <div style={{flex:2}}>
                        <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>聯繫方式</label>
                        <select value={editRec.contactMethod||"電訪"} onChange={e=>{const v=e.target.value;fldEdit("contactMethod",v);fldEdit("timeRange","");if(v==="家訪"&&!editRec.serviceLocation)fldEdit("serviceLocation","案家");}} style={{...inp(),fontSize:13}}>
                          {["電訪","家訪","晤談","外訪","代辦","陪同","簡訊","個研","函件","其他"].map(m=><option key={m}>{m}</option>)}
                        </select>
                      </div>
                      <div style={{flex:1}}>
                        <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>聯繫次數</label>
                        <input type="number" min="1" value={editRec.contactCount||"1"} onChange={e=>fldEdit("contactCount",e.target.value)} style={{...inp(),fontSize:13}}/>
                      </div>
                      <div style={{flex:1}}>
                        <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>服務人次</label>
                        <input type="number" min="1" value={editRec.serviceCount||"1"} onChange={e=>fldEdit("serviceCount",e.target.value)} style={{...inp(),fontSize:13}}/>
                      </div>
                    </div>
                    {["家訪","晤談","外訪","陪同"].includes(editRec.contactMethod)&&(
                      <div style={{gridColumn:"span 2",padding:"8px 12px",background:C.cardAlt,borderRadius:8,border:`1px solid ${C.border}`}}>
                        <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:500}}>服務時間</div>
                        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                          {["1-119分","120分以上"].map(t=>(
                            <label key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,cursor:"pointer",color:C.text}}>
                              <input type="radio" name={`mr-tr-${editRec.id}`} checked={editRec.timeRange===t} onChange={()=>fldEdit("timeRange",t)}/>
                              訪視會談 {t}
                            </label>
                          ))}
                        </div>
                      </div>
                    )}
                    {editRec.contactMethod==="電訪"&&(
                      <div style={{gridColumn:"span 2",padding:"8px 12px",background:C.cardAlt,borderRadius:8,border:`1px solid ${C.border}`}}>
                        <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:500}}>服務時間</div>
                        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                          {["1-9分","10-19分","20分以上"].map(t=>(
                            <label key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,cursor:"pointer",color:C.text}}>
                              <input type="radio" name={`mr-tr-${editRec.id}`} checked={editRec.timeRange===t} onChange={()=>fldEdit("timeRange",t)}/>
                              電話 {t}
                            </label>
                          ))}
                        </div>
                      </div>
                    )}
                    <div style={{gridColumn:"span 2"}}>
                      <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>
                        聯繫對象
                        <span style={{color:C.primary,marginLeft:6,fontWeight:400,fontSize:10}}>可新增多個</span>
                      </label>

                      {(editRec.contactPersons||[]).length>0&&(
                        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                          {(editRec.contactPersons||[]).map((p,pi)=>(
                            <div key={pi} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:20,background:"#EEF7F3",border:`1px solid ${C.primary}`,fontSize:12}}>
                              <span style={{color:C.muted,fontSize:11}}>{p.type}</span>
                              {p.name&&<span style={{color:C.text,fontWeight:600}}>{p.name}</span>}
                              <button onClick={()=>fldEdit("contactPersons",(editRec.contactPersons||[]).filter((_,i)=>i!==pi))}
                                style={{background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:13,padding:0,lineHeight:1,marginLeft:2}}>✕</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,alignItems:"end"}}>
                        <select id="mr-edit-ptype" onChange={()=>setTimeout(()=>document.getElementById("mr-edit-pname")?.focus(),50)} style={{...inp(),fontSize:13}}>
                          <option value="">選擇類型...</option>
                          <option value="本人">本人</option>
                          <option value="同住家屬">同住家屬</option>
                          <option value="親友">親友</option>
                          <option value="專業團隊">專業團隊</option>
                          <option value="機構">機構</option>
                          <option value="鄰居">鄰居</option>
                          <option value="其他">其他</option>
                        </select>
                        <input id="mr-edit-pname" list="resource-names-edit" placeholder="姓名或單位名稱" style={{...inp(),fontSize:13}} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();const t=document.getElementById("mr-edit-ptype")?.value;const n=(e.target.value||"").trim();if(!t)return;fldEdit("contactPersons",[...(editRec.contactPersons||[]),{type:t,name:n}]);document.getElementById("mr-edit-ptype").value="";e.target.value="";}}}/>
                        <datalist id="resource-names-edit">
                          {(data.resources||[]).map(r=><option key={r.id} value={r.name}/>)}
                        </datalist>
                        <button onClick={()=>{
                          const t=document.getElementById("mr-edit-ptype")?.value;
                          const n=(document.getElementById("mr-edit-pname")?.value||"").trim();
                          if(!t)return;
                          fldEdit("contactPersons",[...(editRec.contactPersons||[]),{type:t,name:n}]);
                          document.getElementById("mr-edit-ptype").value="";
                          document.getElementById("mr-edit-pname").value="";
                        }} style={{padding:"8px 12px",borderRadius:8,border:"none",background:C.primary,color:"#fff",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",height:38}}>
                          ＋新增
                        </button>
                      </div>
                    </div>

                    <div>
                      <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>服務地點</label>
                      <select value={editRec.serviceLocation||""} onChange={e=>fldEdit("serviceLocation",e.target.value)} style={{...inp(),fontSize:13}}>
                        <option value="">選擇地點...</option>
                        <option value="本機構">本機構</option>
                        <option value="案家">案家</option>
                        <option value="外機構">外機構</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                    <div style={{gridColumn:"span 2"}}>
                      <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>聯繫內容</label>
                      <textarea value={editRec.content||""} onChange={e=>fldEdit("content",e.target.value)} rows={3} style={{...inp(),fontSize:13,resize:"vertical",lineHeight:1.6}}/>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button onClick={()=>setEditId(null)} style={{padding:"6px 16px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:13,fontFamily:font}}>取消</button>
                    <button onClick={handleSave} style={{padding:"6px 18px",borderRadius:8,border:"none",background:C.primary,color:"#fff",cursor:"pointer",fontSize:13,fontFamily:font,fontWeight:600}}>儲存</button>
                  </div>
                </div>
              : <div key={r.id} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?C.card:C.cardAlt}}>
                  <div onClick={()=>{setViewId(v=>v===r.id?null:r.id);setEditId(null);}}
                    style={{padding:"12px 20px",display:"grid",gridTemplateColumns:"90px 80px 90px 70px 1fr auto",gap:8,alignItems:"center",fontSize:13,cursor:"pointer"}}>
                    <span style={{color:C.primary,fontWeight:600,whiteSpace:"nowrap"}}>{fmtDate(r.date)}</span>
                    <span style={{fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{caseName(r.caseId)}</span>
                    <span style={{color:C.muted,fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(r.contactPersons&&r.contactPersons.length>0)?r.contactPersons.map(p=>p.type+(p.name?" "+p.name:"")).join("、"):(r.contactPersonType?r.contactPersonType+(r.contactPerson?" "+r.contactPerson:""):r.contactPerson||"—")}</span>
                    <span style={{fontSize:11,whiteSpace:"nowrap"}}>
                      <span style={{padding:"2px 7px",borderRadius:20,background:"#EEF7F3",color:C.primary,fontWeight:600}}>{r.contactMethod||"—"}</span>
                      <span style={{color:C.muted,marginLeft:4}}>{"x"}{r.contactCount||1}</span>
                    </span>
                    <span style={{color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.content||"—"}</span>
                    <button onClick={e=>{e.stopPropagation();setEditId(r.id);setEditRec({...r,contactPersons:r.contactPersons||[]});}}
                      style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:12,color:C.muted,fontFamily:font,whiteSpace:"nowrap"}}>
                      {"✏️"}
                    </button>
                  </div>
                  {viewId===r.id&&(
                    <div style={{padding:"12px 20px",background:"#F5F9F7",borderTop:`1px solid ${C.border}`,fontSize:13,color:C.text,lineHeight:1.7,wordBreak:"break-word"}}>
                      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:8,fontSize:12,color:C.muted}}>
                        <span>{"日期: "+fmtDate(r.date)}</span>
                        <span>{"個案: "+caseName(r.caseId)}</span>
                        {(r.contactPersons&&r.contactPersons.length>0)?r.contactPersons.map((p,pi)=><span key={pi}>{p.type+(p.name?" "+p.name:"")}</span>):(r.contactPersonType&&<span>{r.contactPersonType+(r.contactPerson?" "+r.contactPerson:"")}</span>)}
                        <span style={{padding:"1px 8px",borderRadius:20,background:"#EEF7F3",color:C.primary,fontWeight:600}}>{r.contactMethod}</span>
                        <span>{"x"+(r.contactCount||1)}</span>
                      </div>
                      <div style={{whiteSpace:"pre-wrap"}}>{r.content||"—"}</div>
                    </div>
                  )}
                </div>
            ))}
            {(()=>{
              const shown=(filterMethod||searchQuery)?records.filter(r=>(filterMethod?r.contactMethod===filterMethod:true)&&(searchQuery?(caseName(r.caseId).includes(searchQuery)||caseNo(r.caseId).includes(searchQuery)):true)):records;
              const shownCount=shown.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
              const shownCases=new Set(shown.map(r=>r.caseId)).size;
              return(
                <div style={{padding:"12px 20px",background:C.cardAlt,borderTop:`2px solid ${C.border}`,fontSize:12,color:C.muted,display:"flex",gap:20,flexWrap:"wrap"}}>
                  <span>合計 <strong style={{color:C.text}}>{shown.length}</strong> 筆紀錄{filterMethod?" (篩選中)":""}</span>
                  <span>服務人次 <strong style={{color:C.accent}}>{shownCount}</strong> 次</span>
                  <span>涉及個案 <strong style={{color:"#4A6E8A"}}>{shownCases}</strong> 人</span>
                </div>
              );
            })()}
          </div>
      }
    </div>
  );
}

// ── USER SETTINGS ────────────────────────────────────────────────
function UserSettings({userName,onSave,onClose}){
  const [name,setName]=useState(userName||"");
  const [clientId,setClientId]=useState("");
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState(false);
  const [backing,setBacking]=useState(false);
  const [backupMsg,setBackupMsg]=useState("");

  const handleBackup=async()=>{
    setBacking(true);setBackupMsg("");
    try{
      const total=await exportBackup();
      setBackupMsg(`✓ 已下載備份，共 ${total} 筆資料`);
    }catch(e){
      setBackupMsg("✕ 備份失敗："+(e.message||"請稍後再試"));
    }finally{setBacking(false);}
  };

  const handleSave=async()=>{
    if(!name.trim()){alert("請填寫名稱");return;}
    setSaving(true);
    await onSave(name.trim());
    setDone(true);setSaving(false);
    setTimeout(onClose,800);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(26,51,50,0.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.card,borderRadius:16,width:"min(440px,92vw)",boxShadow:"0 24px 64px rgba(0,0,0,0.28)",overflow:"hidden"}}>
        <div style={{background:C.sidebar,padding:"20px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:15,fontWeight:700,color:"#fff",fontFamily:serif}}>用戶設定</span>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"24px"}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6,fontWeight:500}}>社工顯示名稱</label>
          <input value={name} onChange={e=>setName(e.target.value)}
            placeholder="輸入你的名稱"
            style={{...inp(),fontSize:15,marginBottom:8}}
            onKeyDown={e=>e.key==="Enter"&&handleSave()}/>
          <div style={{fontSize:11,color:C.muted,marginBottom:20}}>此名稱會顯示在登入畫面、側邊欄及聯繫紀錄中</div>

          <div style={{borderTop:`1px solid ${C.border}`,paddingTop:18,marginBottom:20}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:8,fontWeight:500}}>資料備份</label>
            <button onClick={handleBackup} disabled={backing}
              style={{width:"100%",padding:"10px 16px",borderRadius:8,border:`1px solid ${C.border}`,background:C.cardAlt,color:C.text,cursor:backing?"default":"pointer",fontSize:13,fontFamily:font,fontWeight:600,opacity:backing?0.6:1}}>
              {backing?"備份中…":"💾 下載完整備份 (JSON)"}
            </button>
            {backupMsg&&<div style={{fontSize:12,marginTop:8,color:backupMsg.startsWith("✓")?"#2A9D5C":"#C0392B"}}>{backupMsg}</div>}
            <div style={{fontSize:11,color:C.muted,marginTop:8,lineHeight:1.6}}>
              匯出全部個案、聯繫紀錄、資源與日誌，存成一個 JSON 檔。建議每月報表完成後執行一次，並存放於安全位置。
            </div>
          </div>

          
          {done
            ? <div style={{textAlign:"center",color:"#2A9D5C",fontWeight:600,fontSize:14}}>✓ 已儲存！</div>
            : <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={onClose} style={{padding:"8px 18px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:13,fontFamily:font}}>取消</button>
                <button onClick={handleSave} disabled={saving} style={{padding:"8px 22px",borderRadius:8,border:"none",background:C.primary,color:"#fff",cursor:"pointer",fontSize:13,fontFamily:font,fontWeight:600,opacity:saving?0.7:1}}>
                  {saving?"儲存中...":"儲存"}
                </button>
              </div>
          }
        </div>
      </div>
    </div>
  );
}

        <button onClick={onUserSettings} style={{width:"100%",padding:"8px 16px",background:"transparent",border:"none",color:"rgba(255,255,255,0.35)",fontSize:12,cursor:"pointer",fontFamily:font,textAlign:"left"}}>⚙ 用戶設定</button>
        {onLogout&&<button onClick={onLogout} style={{width:"100%",padding:"8px 16px",background:"transparent",border:"none",color:"rgba(255,255,255,0.35)",fontSize:12,cursor:"pointer",fontFamily:font,textAlign:"left"}}>⎋ 登出</button>}
        <div style={{padding:"10px 16px",fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center"}}>{new Date().toLocaleDateString("zh-TW",{month:"long",day:"numeric"})}</div>
      </div>
    </div>
  );
}

// ── 諮詢紀錄：不開案的來電諮詢，對應派案及諮詢紀錄表「一般諮詢紀錄」A 到 AG 欄 ──
// 選項照原檔「說明頁&列表清冊」一字不改，包含錯字與尾端空白，貼回原檔統計才對得上
const CZ_LISTS={"svcType": ["需求評估中心(含ICF)", "一般諮詢", "其他單位轉介", "身障科交辦案件(含1999、議員、539)", "獨居且行動不便訪視名冊", "生涯轉銜名單", "高照顧負荷家庭名單(開發)", "等候機構安置名單(開發)", "緊急救援系統", "低收註銷關懷名單(開發)", "早療篩檢名單(開發)"], "source": ["主動發掘", "自行申請", "社會大眾通報", "社政", "需求評估中心", "民政", "勞政", "衛政", "警政", "教政", "1999(含市政信箱)", "其他(請於「說明」填寫)"], "age": ["9以下", "10-19", "20-29", "30-39", "40-49", "50-59", "60-64", "65以上"], "gender": ["男", "女"], "oldDis": ["視障", "聽障", "機能障", "聲語障", "肢障", "智障", "重器障", "顏面傷殘", "植物人", "失智症", "自閉症", "慢性精神病", "多重障", "頑性癲癇", "罕見疾病", "其他認定(請於「說明」填寫)"], "newDis": ["第1類", "第2類", "第3類", "第4類", "第5類", "第6類", "第7類", "第8類"], "disLevel": ["輕度", "中度", "重度", "極重度"], "interviewee": ["本人", "配偶", "父母", "子女", "祖父母", "孫子女", "手足", "朋友", "專業人員", "其他(請於「說明」填寫)"], "cgAge": ["54歲以下", "55歲以上,59歲以下  ", "60歲以上,64歲以下  ", "65歲以上,69歲以下  ", "70歲以上,79歲以下  ", "80歲以上"], "yesno": ["是", "否"], "region": ["臺北市中正區", "臺北市萬華區", "臺北市其他區", "外縣市"], "living": ["獨居", "與家人同住", "入住機構", "居住外縣市", "不願提供資訊", "與他人同住(請於「說明」填寫)", "其他(請於「說明」填寫)"], "result": ["列入一級案", "列入二級案", "列入三級案", "列入四級案", "經評估不開案", "提供福利諮詢", "電訪聯繫後無需求 ", "電訪聯繫後須進一步評估", "無法聯繫", "拒絕接受服務", "不願透露資訊", "列入一般案"], "noOpen": ["無身心障礙證明", "身障者已有個管單位開案協助中", "身障者或家屬無意願接受服務", "個案已入住機構 個案入監服刑", "個案設籍於外縣市", "身障者或家屬有自行解決問題之能力", "無服務使用需求", "個案死亡", "多次聯繫未果", "已使用所需資源且無其他服務需求", "其他(請於「說明」填寫)"], "follow": ["一級案開案(請說明開案社工姓名)", "二級案開案(請說明開案社工姓名)", "三級案開案(請說明開案社工姓名)", "四級案開案(請說明開案社工姓名)", "經評估不開案(請在說明欄位寫原因及處理結果)"], "alone": ["是", "否", "不清楚"], "elder": ["無其他同住者", "否", "不清楚", "有其他同住者"], "recType": ["有紙本服務紀綠(新領證)", "有紙本服務紀錄(福利諮詢)", "無紙本服務紀錄(電話福利諮詢)"], "level": ["一", "二", "三", "四", "不符開案指標"], "status": ["開案中", "追蹤中", "已結案", "不開案", "已併案"]};
const CZ_HEAD=["身分證字號", "姓名", "服務類型", "來源", "轉介單位", "生理性別", "年次", "年齡", "舊制障別", "新制障別", "障礙等級", "訪談對象", "主要照顧者身分", "照顧者性別", "主要照顧者年齡", "主要照顧者領證", "戶籍地", "居住地", "居住狀況", "諮詢完成日", "諮詢結果", "未開案原因", "列冊郵寄名單", "諮詢人次", "追蹤結果", "說明", "獨居", "雙老", "諮詢紀錄", "簡要服務紀錄", "個案等級", "目前服務狀況", "諮詢社工"];
const CZ_COLS=[
  {k:"idNo",t:"text"},{k:"name",t:"text"},{k:"svcType",t:"sel",l:"svcType"},{k:"source",t:"sel",l:"source"},{k:"referral",t:"text"},
  {k:"gender",t:"sel",l:"gender"},{k:"birthYear",t:"num"},{k:"ageBand",t:"sel",l:"age"},{k:"oldDis",t:"sel",l:"oldDis"},{k:"newDis",t:"sel",l:"newDis"},
  {k:"disLevel",t:"sel",l:"disLevel"},{k:"interviewee",t:"sel",l:"interviewee"},{k:"cgRole",t:"list",l:"interviewee"},{k:"cgGender",t:"sel",l:"gender"},{k:"cgAge",t:"sel",l:"cgAge"},
  {k:"cgCert",t:"sel",l:"yesno"},{k:"regAddr",t:"sel",l:"region"},{k:"liveAddr",t:"sel",l:"region"},{k:"living",t:"sel",l:"living"},{k:"doneDate",t:"date"},
  {k:"result",t:"sel",l:"result"},{k:"noOpen",t:"sel",l:"noOpen"},{k:"mailList",t:"sel",l:"yesno"},{k:"times",t:"num"},{k:"follow",t:"sel",l:"follow"},
  {k:"note",t:"text"},{k:"alone",t:"sel",l:"alone"},{k:"elder",t:"sel",l:"elder"},{k:"recType",t:"sel",l:"recType"},{k:"summary",t:"area"},
  {k:"level",t:"sel",l:"level"},{k:"svcStatus",t:"sel",l:"status"},{k:"worker",t:"text"}
].map((c,i)=>({...c,label:CZ_HEAD[i]}));
const CZ_BY_KEY=Object.fromEntries(CZ_COLS.map(c=>[c.k,c]));
const CZ_GROUPS=[
  ["諮詢",["doneDate","svcType","source","referral","interviewee","times","recType","summary"]],
  ["身障者資料",["name","idNo","gender","birthYear","ageBand","oldDis","newDis","disLevel"]],
  ["居住",["regAddr","liveAddr","living","alone","elder"]],
  ["主要照顧者",["cgRole","cgGender","cgAge","cgCert"]],
  ["結果",["result","noOpen","follow","level","svcStatus","mailList","note","worker"]],
];
// 年次可以填民國或西元，年齡區間照清單的八段
function czAgeBand(birthYear,doneDate){
  let y=parseInt(birthYear,10);if(!y)return"";
  if(y>1911)y-=1911;
  const cy=(parseInt(String(doneDate||toDay()).slice(0,4),10)||new Date().getFullYear())-1911;
  const age=cy-y;if(age<0||age>130)return"";
  const tops=[9,19,29,39,49,59,64,Infinity];
  return CZ_LISTS.age[tops.findIndex(t=>age<=t)]||"";
}
const czNeedNote=v=>/請於「說明」填寫|請說明開案社工姓名|請在說明欄位/.test(String(v||""));

function ConsultPage({data,setData,onSave,onDelete,userName}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth()+1);
  const monthStr=`${year}-${String(month).padStart(2,"0")}`;
  const rocYear=year-1911;
  const blank=()=>({...Object.fromEntries(CZ_COLS.map(c=>[c.k,""])),doneDate:toDay(),times:"1",svcType:"一般諮詢",worker:userName||""});
  const [showForm,setShowForm]=useState(()=>{if(window._czOpenNew){window._czOpenNew=false;return true;}return false;});
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState(blank);
  const [search,setSearch]=useState("");
  const [openId,setOpenId]=useState(null);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  useEffect(()=>{
    if(data.consultations!==undefined)return;
    let alive=true;
    (async()=>{
      try{const list=await fbGet("consultations");if(alive)setData(d=>d.consultations!==undefined?d:{...d,consultations:list});}
      catch(e){console.error(e);if(alive){setErr("讀取諮詢紀錄失敗："+e.message);setData(d=>d.consultations!==undefined?d:{...d,consultations:[]});}}
    })();
    return()=>{alive=false;};
  },[]);
  const all=data.consultations||[];
  const loading=data.consultations===undefined;
  const monthList=all.filter(z=>(z.doneDate||"").startsWith(monthStr)).sort((a,b)=>(b.doneDate||"").localeCompare(a.doneDate||"")||(b.createdAt||"").localeCompare(a.createdAt||""));
  const shown=search.trim()?monthList.filter(z=>[z.name,z.summary,z.note,z.idNo].some(v=>String(v||"").includes(search.trim()))):monthList;
  const sumTimes=list=>list.reduce((s,z)=>s+(parseInt(z.times,10)||0),0);
  const byG=g=>monthList.filter(z=>z.gender===g);
  const noGender=monthList.filter(z=>!z.gender).length;

  const set=(k,v)=>setForm(f=>{
    const n={...f,[k]:v};
    if(k==="birthYear"||k==="doneDate"){const b=czAgeBand(k==="birthYear"?v:f.birthYear,k==="doneDate"?v:f.doneDate);if(b)n.ageBand=b;}
    return n;
  });
  const startNew=()=>{setForm(blank());setEditId(null);setShowForm(true);window.scrollTo({top:0,behavior:"smooth"});};
  const startEdit=z=>{setForm({...blank(),...z});setEditId(z.id);setShowForm(true);window.scrollTo({top:0,behavior:"smooth"});};
  const cancel=()=>{setShowForm(false);setEditId(null);setForm(blank());};
  const save=async()=>{
    if(!form.doneDate){alert("請填諮詢完成日");return;}
    const t=parseInt(form.times,10);
    if(!(t>=1&&t<=99)){alert("諮詢人次要填 1 到 99 的整數");return;}
    if(!form.gender&&!confirm("沒有填生理性別，原檔的每月諮詢統計不會算到這筆。確定要存嗎？"))return;
    const prev=editId?all.find(x=>x.id===editId):null;
    // 年次存民國年；打西元的自動換算
    const by=parseInt(form.birthYear,10);
    const birthYear=by>1911?String(by-1911):(form.birthYear===""||form.birthYear==null?"":String(form.birthYear));
    const rec={...(prev||{}),...form,birthYear,times:String(t),name:String(form.name||"").trim(),idNo:String(form.idNo||"").trim().toUpperCase(),id:editId||uid(),createdAt:prev?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
    setBusy(true);
    try{
      setData(d=>({...d,consultations:[...(d.consultations||[]).filter(x=>x.id!==rec.id),rec]}));
      await onSave("consultations",rec);
      const [y,m]=rec.doneDate.split("-").map(Number);
      if(y&&m){setYear(y);setMonth(m);}
      cancel();
    }finally{setBusy(false);}
  };
  const del=async z=>{
    if(!confirm(`確定刪除 ${z.doneDate} ${z.name||"未留姓名"} 這筆諮詢？`))return;
    setData(d=>({...d,consultations:(d.consultations||[]).filter(x=>x.id!==z.id)}));
    if(onDelete)await onDelete("consultations",z.id);
  };
  // 轉成個案：新增一個個案，諮詢這筆保留並標記
  const toCase=async z=>{
    const linked=z.caseId&&(data.cases||[]).find(c=>c.id===z.caseId);
    if(linked){alert(`這筆已經轉成個案：${linked.name}`);return;}
    const lvMap={"列入一級案":"一","列入二級案":"二","列入三級案":"三","列入四級案":"四"};
    const lv=["一","二","三","四"].includes(z.level)?z.level:(lvMap[String(z.result||"").trim()]||"");
    const age=(()=>{let y=parseInt(z.birthYear,10);if(!y)return"";if(y>1911)y-=1911;const a=new Date().getFullYear()-1911-y;return a>=0&&a<=130?String(a):"";})();
    const dup=(data.cases||[]).filter(c=>(z.idNo&&c.idNo&&c.idNo.toUpperCase()===z.idNo.toUpperCase())||(z.name&&c.name===z.name));
    const lines=[`姓名：${z.name||"未填"}`,`生理性別：${z.gender||"未填"}`,`新制障別：${z.newDis||"未填"}`,`障礙等級：${z.disLevel||"未填"}`,`現在等級：${lv||"未填"}`,`案況：開案中`];
    let msg="要把這筆諮詢轉成個案嗎？諮詢紀錄會保留。\n\n"+lines.join("\n");
    if(dup.length)msg+=`\n\n注意：個案管理裡已經有同名或同身分證字號的個案：${dup.map(c=>c.name).join("、")}`;
    if(!z.name)msg+="\n\n這筆沒有填姓名，建議先補上再轉。";
    if(!confirm(msg))return;
    const c={id:uid(),name:z.name||"",caseNo:"",idNo:z.idNo||"",status:"開案中",source:String(z.source||"").trim(),referralUnit:z.referral||"",gender:z.gender||"",birthDate:"",age,
      disabilityType:z.newDis||"",disabilitySub:"",disabilityLevel:z.disLevel||"",disabilityDetail:"",registeredAddr:z.regAddr||"",addr:z.liveAddr||"",livingStatus:String(z.living||"").trim(),
      livingAlone:z.alone==="是"||z.alone==="否"?z.alone:"",elderlyCouple:"",mainWorker:z.worker||userName||"",caseInDate:"",assignDate:"",evalDueDate:"",openDate:toDay(),
      systemLevel:"",initialLevel:lv,changeLevel:lv,phone:"",phone2:"",emergencyContact:"",emergencyPhone:"",emergencyRelation:"",note:`由諮詢紀錄轉入，諮詢完成日 ${z.doneDate||""}`};
    const zz={...z,caseId:c.id,updatedAt:new Date().toISOString()};
    setData(d=>({...d,cases:[...(d.cases||[]),c],consultations:(d.consultations||[]).map(x=>x.id===z.id?zz:x)}));
    await onSave("cases",c);
    await onSave("consultations",zz);
    alert(`已新增個案「${c.name||"未填姓名"}」，可以到個案管理補其他資料。`);
  };
  const download=()=>{
    if(monthList.length===0){alert("這個月沒有諮詢紀錄");return;}
    if(noGender>0&&!confirm(`這個月有 ${noGender} 筆沒填生理性別，原檔的每月諮詢統計不會算到。還是要下載嗎？`))return;
    const XL=window.XLSX;
    const rows=[CZ_HEAD];
    const list=[...monthList].sort((a,b)=>(a.doneDate||"").localeCompare(b.doneDate||"")||(a.createdAt||"").localeCompare(b.createdAt||""));
    list.forEach(z=>rows.push(CZ_COLS.map(c=>{
      const v=z[c.k];
      if(c.t==="num"){const n=parseInt(v,10);return Number.isFinite(n)?n:"";}
      if(c.t==="date")return"";
      return v==null?"":String(v);
    })));
    const ws=XL.utils.aoa_to_sheet(rows);
    const dc=CZ_COLS.findIndex(c=>c.t==="date");
    list.forEach((z,i)=>{const s=rbSerial(z.doneDate);if(s!==null)ws[XL.utils.encode_cell({r:i+1,c:dc})]={t:"n",v:s,z:"yyyy/m/d"};});
    ws["!cols"]=CZ_COLS.map(c=>({wch:c.t==="area"?40:c.k==="note"?24:12}));
    const wb=XL.utils.book_new();
    XL.utils.book_append_sheet(wb,ws,"一般諮詢紀錄");
    XL.writeFile(wb,`一般諮詢紀錄_民${rocYear}年${month}月.xlsx`);
  };
  const prevMonth=()=>{if(month===1){setYear(y=>y-1);setMonth(12);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===12){setYear(y=>y+1);setMonth(1);}else setMonth(m=>m+1);};

  // 注意：這裡用函式產生欄位，不要改成元件，否則每打一個字輸入框都會失去焦點
  const field=k=>{
    const c=CZ_BY_KEY[k];
    const v=form[k]??"";
    const wide=c.t==="area"||k==="note";
    let input;
    if(c.t==="sel")input=<select value={v} onChange={e=>set(k,e.target.value)} style={inp({fontSize:13})}><option value="">未選</option>{CZ_LISTS[c.l].map(o=><option key={o} value={o}>{o.trim()}</option>)}</select>;
    else if(c.t==="list")input=<><input value={v} onChange={e=>set(k,e.target.value)} list={"cz-list-"+c.l} placeholder="可選可打字" style={inp({fontSize:13})}/><datalist id={"cz-list-"+c.l}>{CZ_LISTS[c.l].map(o=><option key={o} value={o}/>)}</datalist></>;
    else if(c.t==="date")input=<input type="date" value={v} onChange={e=>set(k,e.target.value)} style={inp({fontSize:13})}/>;
    else if(c.t==="num")input=<input type="number" value={v} min={k==="times"?1:undefined} max={k==="times"?99:undefined} onChange={e=>set(k,e.target.value)} placeholder={k==="birthYear"?"民國年，例如 75":""} style={inp({fontSize:13})}/>;
    else if(c.t==="area")input=<textarea value={v} onChange={e=>set(k,e.target.value)} rows={4} style={inp({fontSize:13,lineHeight:1.7,resize:"vertical"})}/>;
    else input=<input value={v} onChange={e=>set(k,e.target.value)} style={inp({fontSize:13})}/>;
    const req=k==="doneDate"||k==="gender";
    return(
      <div key={k} style={wide?{gridColumn:"span 2"}:{}}>
        <Label>{c.label}{req?" *":""}{k==="ageBand"&&form.birthYear?"　依年次自動帶入":""}</Label>
        {input}
        {k==="note"&&CZ_COLS.some(cc=>czNeedNote(form[cc.k]))&&<div style={{fontSize:11,color:C.accent,marginTop:3}}>你選的「{CZ_COLS.filter(cc=>czNeedNote(form[cc.k])).map(cc=>String(form[cc.k]).trim()).join("、")}」要在這裡補充說明</div>}
      </div>
    );
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <h1 style={{fontSize:22,fontWeight:700,fontFamily:serif,color:C.text,margin:0}}>諮詢紀錄</h1>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button onClick={prevMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:16}}>‹</button>
          <span style={{fontSize:15,fontWeight:700,color:C.text,minWidth:110,textAlign:"center",fontFamily:serif}}>民{rocYear}年 {month}月</span>
          <button onClick={nextMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:16}}>›</button>
          <button onClick={download} style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#4A6E8A",color:"#fff",cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600}}>⬇ 下載本月一般諮詢紀錄</button>
          <Btn variant={showForm?"secondary":"primary"} onClick={()=>showForm?cancel():startNew()} style={{fontSize:13,padding:"7px 16px"}}>{showForm?"取消":"+ 新增諮詢"}</Btn>
        </div>
      </div>
      <div style={{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.7}}>記錄不開案的來電或臨櫃諮詢，跟個案紀錄分開存，不會算進月報表的服務量。下載的 Excel 欄位跟「一般諮詢紀錄」A 到 AG 欄相同，貼進原檔即可，AH、AI 輔助欄是公式，不用貼。</div>
      {err&&<div style={{fontSize:12,color:"#A03030",background:"#FFF0F0",border:"1px solid #ECC8C8",borderRadius:8,padding:"6px 10px",marginBottom:12}}>{err}</div>}

      {showForm&&(
        <Card style={{marginBottom:20}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{editId?"編輯諮詢":"新增諮詢"}</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:12}}>* 必填。生理性別和諮詢完成日是原檔每月統計用的欄位。</div>
          {CZ_GROUPS.map(([title,keys])=>(
            <div key={title} style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,color:C.primary,borderBottom:`1px solid ${C.border}`,paddingBottom:4,marginBottom:10}}>{title}</div>
              <div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px"}}>{keys.map(field)}</div>
            </div>
          ))}
          <div style={{display:"flex",gap:10,marginTop:6}}>
            <Btn onClick={save} disabled={busy}>{busy?"儲存中...":editId?"更新":"儲存"}</Btn>
            <Btn variant="secondary" onClick={cancel}>取消</Btn>
          </div>
        </Card>
      )}

      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {label:"本月諮詢筆數",val:monthList.length,color:C.primary},
          {label:"諮詢人次",val:sumTimes(monthList),color:C.accent},
          {label:"男",val:byG("男").length,sub:`${sumTimes(byG("男"))} 人次`,color:"#4A6E8A"},
          {label:"女",val:byG("女").length,sub:`${sumTimes(byG("女"))} 人次`,color:"#8B6DB8"},
        ].map(({label,val,color,sub})=>(

                      {z.gender&&<span style={{fontSize:12,color:C.muted}}>{z.gender}</span>}
                      {z.svcType&&<span style={{fontSize:11,padding:"1px 8px",borderRadius:20,background:"#EAF0F8",color:"#4A6E8A"}}>{z.svcType}</span>}
                      {z.result&&<span style={{fontSize:11,padding:"1px 8px",borderRadius:20,background:"#FFF4E0",color:C.accent}}>{String(z.result).trim()}</span>}

                    </div>
                    <div style={{fontSize:12,color:C.muted,marginTop:3,...(open?{whiteSpace:"pre-wrap",wordBreak:"break-word"}:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"})}}>{z.summary||"沒有簡要服務紀錄"}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}} onClick={e=>e.stopPropagation()}>
                    <Btn variant="secondary" onClick={()=>startEdit(z)} style={{padding:"4px 10px",fontSize:11}}>編輯</Btn>
                    {!linked&&<Btn variant="accent" onClick={()=>toCase(z)} style={{padding:"4px 10px",fontSize:11}}>轉成個案</Btn>}
                    <Btn variant="danger" onClick={()=>del(z)} style={{padding:"4px 10px",fontSize:11}}>刪除</Btn>
                  </div>
                </div>
                {open&&(
                  <div style={{padding:"4px 16px 14px 90px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"4px 16px",fontSize:12}}>
                    {CZ_COLS.filter(c=>c.k!=="summary"&&String(z[c.k]??"").trim()).map(c=>(
                      <div key={c.k}><span style={{color:C.muted}}>{c.label}：</span><span style={{color:C.text}}>{String(z[c.k]).trim()}</span></div>
                    ))}
                    {linked&&<div style={{gridColumn:"1/-1",color:"#2A7A4A"}}>已轉成個案：{linked.name}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>}
    </div>
  );
}

// ── 比對主管的開案名單：只在瀏覽器讀檔，不存資料庫 ──────────────
function reLv(s){const m=String(s||"").match(/[一二三四1-4]/);return m?({"一":1,"二":2,"三":3,"四":4}[m[0]]||Number(m[0])):null;}
const RE_LV_TXT=["","第一級","第二級","第三級","第四級"];
function reNo(s){let v=String(s??"").replace(/\s+/g,"").toUpperCase();if(/^\d+$/.test(v))v=v.replace(/^0+/,"")||"0";return v;}
function reName(s){return String(s??"").replace(/\s+/g,"");}
function reDate(v){
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400*1000));return`${d.getUTCFullYear()-1911}/${d.getUTCMonth()+1}/${d.getUTCDate()}`;}
  return String(v??"").trim();
}
// 主管名單只列開案中，列管中不算
const reActive=c=>c.status==="開案中";
function reParse(wb){
  const XL=window.XLSX;
  for(const sn of wb.SheetNames){
    const rows=XL.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:true,blankrows:false});
    for(let h=0;h<Math.min(rows.length,10);h++){
      const head=rows[h].map(x=>String(x??"").replace(/\s+/g,""));
      const find=(...names)=>head.findIndex(x=>names.some(n=>x.startsWith(n)));
      const iLv=find("分級","個案等級","等級");
      const iNo=find("個案編號","案號");
      const iName=find("身心障礙者姓名","個案姓名","姓名");
      if(iLv<0||(iNo<0&&iName<0))continue;
      const iWorker=find("主責人員","主責社工");
      const iOpen=find("開案時間","開案日期");
      const list=[];
      rows.slice(h+1).forEach(r=>{
        const no=iNo>=0?String(r[iNo]??"").trim():"";
        const name=iName>=0?String(r[iName]??"").trim():"";
        const lvRaw=String(r[iLv]??"").trim();
        if(!no&&!name&&!lvRaw)return;
        list.push({no,name,lvRaw,lv:reLv(lvRaw),worker:iWorker>=0?String(r[iWorker]??"").trim():"",open:iOpen>=0?reDate(r[iOpen]):""});
      });
      return{sheet:sn,list};
    }
  }
  throw new Error("找不到有「分級」和「個案編號」或「身心障礙者姓名」表頭的工作表");
}
// 先用案號配對，配不到再用姓名；姓名重複無法判斷的另外列出
function reCompare(fileList,cases){
  const res={pairs:[],onlyFile:[],onlyApp:[],inactive:[],lvDiff:[],noDiff:[],nameDiff:[],ambiguous:[],dupFile:[]};
  // 名單裡同一人出現兩次以上：有案號用案號判斷，沒案號用姓名；第一列拿去配對，其餘列出來
  const seen=new Map();
  fileList=fileList.filter(f=>{
    const k=reNo(f.no)?"no:"+reNo(f.no):(reName(f.name)?"name:"+reName(f.name):"");
    if(!k)return true;
    if(seen.has(k)){res.dupFile.push({f,first:seen.get(k)});return false;}
    seen.set(k,f);return true;
  });
  const used=new Set();
  const index=(fn)=>{const m=new Map();cases.forEach(c=>{const k=fn(c);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(c);});return m;};
  const byNo=index(c=>reNo(c.caseNo)),byName=index(c=>reName(c.name));
  const pending=[];
  fileList.forEach(f=>{
    const k=reNo(f.no);const hits=k?(byNo.get(k)||[]).filter(c=>!used.has(c.id)):[];
    if(hits.length===1){used.add(hits[0].id);res.pairs.push({f,c:hits[0],by:"no"});}
    else pending.push(f);
  });
  pending.forEach(f=>{
    const k=reName(f.name);const hits=k?(byName.get(k)||[]).filter(c=>!used.has(c.id)):[];
    if(hits.length===1){used.add(hits[0].id);res.pairs.push({f,c:hits[0],by:"name"});}
    else if(hits.length>1)res.ambiguous.push({f,hits});
    else res.onlyFile.push(f);
  });
  res.pairs.forEach(p=>{
    if(!reActive(p.c))res.inactive.push(p);
    if(p.f.lv&&reLv(p.c.changeLevel)!==p.f.lv)res.lvDiff.push(p);
    if(p.by==="name"&&p.f.no&&reNo(p.f.no)!==reNo(p.c.caseNo))res.noDiff.push(p);
    if(p.by==="no"&&reName(p.f.name)&&reName(p.c.name)&&reName(p.f.name)!==reName(p.c.name))res.nameDiff.push(p);
  });
  const amb=new Set(res.ambiguous.flatMap(a=>a.hits.map(c=>c.id)));
  cases.filter(c=>reActive(c)&&!used.has(c.id)&&!amb.has(c.id)).forEach(c=>res.onlyApp.push(c));
  return res;
}

function CaseReconcile({data,setData,onSave,userName}){
  const [file,setFile]=useState(()=>window._reconCache||null);
  const [worker,setWorker]=useState(()=>window._reconCache?.worker??null);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const ref=useRef(null);
  const load=async f=>{
    if(!f)return;
    setErr("");setLoading(true);
    try{
      const wb=window.XLSX.read(await f.arrayBuffer(),{type:"array"});
      const p=reParse(wb);
      const workers=[...new Set(p.list.map(x=>x.worker).filter(Boolean))];
      const mine=workers.find(w=>userName&&w.includes(userName))||"";
      const b={...p,fileName:f.name,loadedAt:new Date(),workers,worker:mine};
      window._reconCache=b;setFile(b);setWorker(mine);
    }catch(e){console.error(e);setErr("讀取失敗："+e.message);}
    finally{setLoading(false);}
  };
  const pickWorker=w=>{setWorker(w);if(window._reconCache)window._reconCache.worker=w;};
  // ── 在比對頁直接打開個案編輯視窗，自己確認後再改 ──
  const [editCase,setEditCase]=useState(null);
  const [msg,setMsg]=useState("");
  // 存檔邏輯照個案管理的 saveEdit：改了等級就自動記一筆等級異動
  const saveEdit=async updated=>{
    const prev=(data.cases||[]).find(c=>c.id===updated.id);
    for(const f of ["systemLevel","initialLevel","changeLevel"]){
      if(prev&&prev[f]&&updated[f]&&prev[f]!==updated[f]){
        const record={id:uid(),caseId:updated.id,caseName:updated.name,date:toDay(),field:f,from:prev[f],to:updated[f],note:"",auto:true};
        setData(d=>({...d,levelHistory:[...(d.levelHistory||[]),record]}));
        await onSave("levelHistory",record);
      }
    }
    setData(d=>({...d,cases:(d.cases||[]).map(c=>c.id===updated.id?updated:c)}));
    await onSave("cases",updated);
    setMsg(`已儲存「${updated.name}」，比對結果已更新`);
  };
  const editBtn=c=><button onClick={()=>{setMsg("");setEditCase(c);}} style={{marginLeft:10,padding:"2px 10px",borderRadius:6,border:"1px solid #5E8A5A",background:"#fff",color:"#3E6A3A",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>編輯</button>;
  const list=file?(worker?file.list.filter(x=>x.worker===worker):file.list):[];
  const res=file?reCompare(list,data.cases||[]):null;
  const appActive=(data.cases||[]).filter(reActive);
  const counts=[1,2,3,4].map(n=>({n,f:list.filter(x=>x.lv===n).length,a:appActive.filter(c=>reLv(c.changeLevel)===n).length}));
  const appNoLv=appActive.filter(c=>!reLv(c.changeLevel)).length;
  const fileNoLv=list.filter(x=>!x.lv).length;

  const who=(no,name)=><><b style={{color:C.text}}>{name||"姓名空白"}</b><span style={{color:C.muted,marginLeft:8}}>{no?`案號 ${no}`:"沒有案號"}</span></>;
  const Sec=({title,hint,items,render,color})=>(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,marginTop:12,overflow:"hidden"}}>
      <div style={{padding:"9px 14px",background:items.length?color:"#F0F5F0",fontSize:13,fontWeight:700,color:items.length?"#5A3A10":"#2A7A4A"}}>
        {items.length?`${title}：${items.length} 筆`:`✓ ${title}：沒有`}
        {items.length>0&&hint&&<div style={{fontSize:11,fontWeight:500,color:C.muted,marginTop:2}}>{hint}</div>}
      </div>
      {items.map((x,i)=><div key={i} style={{padding:"7px 14px",borderTop:`1px solid ${C.border}`,fontSize:13,lineHeight:1.6}}>{render(x)}</div>)}
    </div>
  );
  return(
    <div style={{background:"#F4F7F2",border:"2px solid #5E8A5A",borderRadius:12,padding:20,marginBottom:20}}>
      <div style={{fontSize:15,fontWeight:700,color:"#3E6A3A",marginBottom:10}}>🧾 比對主管的開案名單</div>
      <div onClick={()=>ref.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();load(e.dataTransfer.files?.[0]);}}
        style={{border:"1.5px dashed #5E8A5A",borderRadius:8,padding:"8px 12px",background:"#fff",cursor:"pointer",fontSize:12,color:file?C.muted:"#3E6A3A",lineHeight:1.6,marginBottom:10}}>
        {loading?"讀取中..."
          :file?<>📄 已讀取 <b style={{color:C.text}}>{file.list.length}</b> 筆・{file.fileName}・{file.loadedAt.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}　<span style={{color:"#3E6A3A"}}>點這裡或拖入新檔可重新讀取</span></>
          :<>📂 把主管附的名單 Excel 拖到這裡，或點這裡選擇檔案<br/><span style={{color:C.muted}}>只在瀏覽器讀取，不會存進資料庫</span></>}
      </div>
      <input ref={ref} type="file" accept=".xlsx,.xlsm,.xls" style={{display:"none"}} onChange={e=>{load(e.target.files?.[0]);e.target.value="";}}/>
      {err&&<div style={{fontSize:12,color:"#A03030",marginBottom:8}}>{err}</div>}
      {msg&&<div style={{fontSize:12,color:"#2A7A4A",background:"#E8F5EE",borderRadius:8,padding:"6px 10px",marginBottom:8}}>✓ {msg}</div>}
      {file&&(
        <>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",fontSize:12,color:C.muted,marginBottom:10}}>
            主責人員：
            {file.workers.length>0
              ?<select value={worker||""} onChange={e=>pickWorker(e.target.value)} style={inp({fontSize:12,width:"auto",padding:"4px 8px"})}>
                 <option value="">全部 {file.list.length} 筆</option>
                 {file.workers.map(w=><option key={w} value={w}>{w}・{file.list.filter(x=>x.worker===w).length} 筆</option>)}
               </select>
              :<span>檔案裡主責人員是空的，用全部 {file.list.length} 筆比對</span>}
            {file.workers.length>0&&!worker&&<span style={{color:C.accent}}>目前用全部名單比對，別人的個案會出現在「系統沒有」</span>}
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {counts.map(({n,f,a})=>(
              <div key={n} style={{background:C.card,border:`1px solid ${f===a?C.border:"#E0B060"}`,borderRadius:10,padding:"10px 14px",flex:1,minWidth:110}}>
                <div style={{fontSize:12,color:C.muted}}>{RE_LV_TXT[n]}</div>
                <div style={{fontSize:14,color:C.text,marginTop:2}}>主管 <b>{f}</b>　系統 <b style={{color:f===a?C.primary:C.accent}}>{a}</b></div>
              </div>
            ))}
            <div style={{background:C.card,border:`1px solid ${list.length===appActive.length?C.border:"#E0B060"}`,borderRadius:10,padding:"10px 14px",flex:1,minWidth:110}}>
              <div style={{fontSize:12,color:C.muted}}>合計</div>
              <div style={{fontSize:14,color:C.text,marginTop:2}}>主管 <b>{list.length}</b>　系統 <b style={{color:list.length===appActive.length?C.primary:C.accent}}>{appActive.length}</b></div>
            </div>
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:6}}>系統的數字是案況「開案中」，不含列管中，依現在等級分組。{appNoLv>0?`系統有 ${appNoLv} 個開案中個案沒填等級，或等級不是一到四級。`:""}{fileNoLv>0?`名單有 ${fileNoLv} 筆分級看不懂。`:""}</div>
          <Sec title="主管名單有、系統沒有" color="#FFF4E0" items={res.onlyFile} hint="案號和姓名都配不到。可能是系統漏建，或案號、姓名寫法不同。"
            render={f=><>{who(f.no,f.name)}<span style={{marginLeft:8}}>{f.lvRaw}</span>{f.open&&<span style={{color:C.muted,marginLeft:8}}>開案 {f.open}</span>}</>}/>
          <Sec title="系統有、主管名單沒有" color="#FFF4E0" items={res.onlyApp} hint="系統是開案中，但名單裡找不到。如果已經結案，按「編輯」把案況改成結案；也可能是名單漏列。"
            render={c=><>{who(c.caseNo,c.name)}<span style={{marginLeft:8}}>{c.changeLevel?`${c.changeLevel}級`:"沒填等級"}</span><span style={{color:C.muted,marginLeft:8}}>{c.status}</span>{editBtn(c)}</>}/>
          <Sec title="等級不同" color="#FFF4E0" items={res.lvDiff} hint="確認以哪邊為準後，按「編輯」修改現在等級。存檔時會跟在個案管理一樣記下等級異動。"
            render={p=><>{who(p.c.caseNo||p.f.no,p.c.name||p.f.name)}<span style={{marginLeft:8}}>主管 {p.f.lvRaw}</span><span style={{marginLeft:8,color:C.accent,fontWeight:600}}>系統 {p.c.changeLevel?`${p.c.changeLevel}級`:"沒填"}</span>{editBtn(p.c)}</>}/>
          <Sec title="名單有，但系統案況不是開案中" color="#FFF4E0" items={res.inactive}
            render={p=><>{who(p.c.caseNo,p.c.name)}<span style={{marginLeft:8}}>主管 {p.f.lvRaw}</span><span style={{marginLeft:8,color:C.accent,fontWeight:600}}>系統 {p.c.status}</span>{editBtn(p.c)}</>}/>
          <Sec title="用姓名配對，但案號不同" color="#EAF0F8" items={res.noDiff} hint="同一個人，但系統的案號跟名單不一樣。確認後按「編輯」修改案號。"
            render={p=><><b style={{color:C.text}}>{p.c.name}</b><span style={{marginLeft:8}}>名單案號 {p.f.no}</span><span style={{marginLeft:8,color:C.accent}}>系統案號 {p.c.caseNo||"空白"}</span>{editBtn(p.c)}</>}/>
          <Sec title="案號相同，但姓名不同" color="#FFF4E0" items={res.nameDiff} hint="用案號配到同一筆，但姓名不一樣。可能是案號打錯、姓名改過或寫法不同，請確認是不是同一個人。"
            render={p=><><span style={{color:C.muted}}>案號 {p.c.caseNo}</span><span style={{marginLeft:8}}>名單姓名 <b style={{color:C.text}}>{p.f.name}</b></span><span style={{marginLeft:8,color:C.accent}}>系統姓名 <b>{p.c.name}</b></span>{editBtn(p.c)}</>}/>
          <Sec title="名單裡重複出現" color="#EAF0F8" items={res.dupFile} hint="主管名單裡同一個案號或姓名出現兩次以上，只拿第一列比對，其餘列在這裡，可能是名單重複登打。"
            render={d=><>{who(d.f.no,d.f.name)}<span style={{marginLeft:8}}>{d.f.lvRaw}</span>{d.first.lvRaw!==d.f.lvRaw&&<span style={{marginLeft:8,color:C.accent}}>第一列是 {d.first.lvRaw}</span>}</>}/>
          <Sec title="同名，沒辦法判斷是哪一位" color="#EAF0F8" items={res.ambiguous} hint="系統裡有好幾個同名個案，又沒有案號可以對，請人工確認。"
            render={a=><>{who(a.f.no,a.f.name)}<span style={{marginLeft:8}}>{a.f.lvRaw}</span><span style={{color:C.muted,marginLeft:8}}>系統同名 {a.hits.length} 位：</span>{a.hits.map(c=><span key={c.id} style={{marginLeft:8}}>{c.caseNo||"沒有案號"}・{c.changeLevel?c.changeLevel+"級":"沒填等級"}・{c.status}{editBtn(c)}</span>)}</>}/>
          {editCase&&<CaseEditModal caseData={editCase} onSave={saveEdit} onClose={()=>setEditCase(null)}/>}
          <div style={{fontSize:11,color:C.muted,marginTop:10}}>配對方式：先用案號，配不到再用姓名。兩邊一致的有 {res.pairs.filter(p=>!res.lvDiff.includes(p)&&!res.inactive.includes(p)&&!res.nameDiff.includes(p)).length} 筆。</div>
        </>
      )}
    </div>
  );
}

function App(){
  const [view,setView]=useState("dashboard");
  const [data,setData]=useState({cases:[],visits:[],resources:DEFAULT_RESOURCES,diary:[],events:[],caseRecords:[],levelHistory:[]});
  const [syncStatus,setSyncStatus]=useState("local");
  const [showSetup,setShowSetup]=useState(false);
  const [ready,setReady]=useState(false);
  const [authReady,setAuthReady]=useState(false);
  const [user,setUser]=useState(null);
  const [userName,setUserName]=useState("");
  const [showUserSettings,setShowUserSettings]=useState(false);

  // 初始化時先等 Firebase Auth 狀態確認
  useEffect(()=>{
    (async()=>{
      if(isFirebaseConfigured()){
        const ok=await initFirebase();
        if(ok){
          // 監聽登入狀態
          firebase.auth().onAuthStateChanged(u=>{
            setUser(u);
            setAuthReady(true);
          });
        }else{
          setAuthReady(true);
        }
      }else{
        setAuthReady(true);
      }
    })();
  },[]);

  // 登入後才載入資料
  useEffect(()=>{
    if(!authReady)return;
    (async()=>{
      if(user&&isFirebaseConfigured()&&firebaseReady){
        setSyncStatus("syncing");
        try{
          // 載入用戶名稱
          try{
            const profileDoc=await db.collection("users").doc(user.uid).get();
            if(profileDoc.exists&&profileDoc.data().displayName){
              setUserName(profileDoc.data().displayName);
            }else{
              setUserName(user.email?.split("@")[0]||"社工");
            }
          }catch{}
          // 嘗試搬移舊資料（只在第一次登入時執行）
          await migrateOldData();
          // 一次性載入靜態資料
          const [cases,visits,resources,diary,levelHistory]=await Promise.all([
            fbGet("cases"),fbGet("visits"),fbGet("resources"),fbGet("diary"),fbGet("levelHistory")
          ]);
          const r=resources.length>0?resources:DEFAULT_RESOURCES;
          setData(d=>({...d,cases,visits,resources:r,diary,levelHistory:levelHistory||[]}));

          // onSnapshot 即時監聽經常變動的資料（返回 unsubscribe 函式）
          const unsubEvents=userCol("events").onSnapshot(snap=>{
            const events=snap.docs.map(d=>({id:d.id,...d.data()}));
            setData(d=>({...d,events}));
          });
          const unsubRecords=userCol("caseRecords").onSnapshot(snap=>{
            const caseRecords=snap.docs.map(d=>({id:d.id,...d.data()}));
            setData(d=>({...d,caseRecords}));
          });
          // 儲存清除函式供登出時使用
          window._unsubFirestore=[unsubEvents,unsubRecords];
          setSyncStatus("synced");
        }catch(e){
          console.error(e);
          const local=loadLocal();
          if(local)setData(local);
          setSyncStatus("error");
        }
      }else if(!user){
        // 未登入，清空資料
        setData({cases:[],visits:[],resources:DEFAULT_RESOURCES,diary:[],caseRecords:[],levelHistory:[]});
      }else{
        const local=loadLocal();
        if(local)setData(local);
        setSyncStatus("local");
      }
      setReady(true);
    })();
  },[authReady,user]);

  // 本機備份
  useEffect(()=>{if(ready&&user)saveLocal(data);},[data,ready,user]);

  const saveUserName=async(name)=>{
    setUserName(name);
    if(db&&user){
      await db.collection("users").doc(user.uid).set({displayName:name},{merge:true});
    }
  };

  const onSave=async(col,item)=>{
    if(!firebaseReady)return;
    setSyncStatus("syncing");
    try{await fbSave(col,item);setSyncStatus("synced");}
    catch(e){console.error(e);setSyncStatus("error");}
  };
  const onDelete=async(col,id)=>{
    if(!firebaseReady)return;
    setSyncStatus("syncing");
    try{await fbDelete(col,id);setSyncStatus("synced");}
    catch(e){console.error(e);setSyncStatus("error");}
  };

  const handleLogout=async()=>{
    if(!confirm("確定要登出嗎？"))return;
    (window._unsubFirestore||[]).forEach(fn=>fn());window._unsubFirestore=[];firebase.auth().signOut();
    setReady(false);
  };

  // 等待 auth 狀態確認
  if(!authReady)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.bg,fontFamily:font,color:C.muted,flexDirection:"column",gap:12}}><div style={{fontSize:16}}>載入中...</div></div>);

  // 未登入 → 顯示登入畫面
  if(!user&&isFirebaseConfigured())return<LoginScreen onLogin={()=>{}}/>;

  // 資料載入中
  if(!ready)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.bg,fontFamily:font,color:C.muted,flexDirection:"column",gap:12}}><div style={{fontSize:16}}>資料載入中...</div><div style={{fontSize:12,color:C.border}}>正在連接雲端...</div></div>);

  return(
    <div className="layout" style={{display:"flex",height:"100vh",overflow:"hidden",fontFamily:font,background:C.bg}}>
      {showSetup&&<SetupGuide/>}
      <Sidebar view={view} setView={setView} syncStatus={syncStatus} onSetup={()=>setShowSetup(v=>!v)} onLogout={user?handleLogout:null} userName={userName} onUserSettings={()=>setShowUserSettings(true)}/>
      {showUserSettings&&<UserSettings userName={userName} onSave={saveUserName} onClose={()=>setShowUserSettings(false)}/>}
      <div className="main-content" style={{flex:1,overflow:"auto",padding:"32px 36px",WebkitOverflowScrolling:"touch",minHeight:0}}>
        {view==="dashboard"&&<Dashboard data={data} setView={setView} setData={setData} onSave={onSave}/>}
        {view==="calendar"  &&<CalendarView data={data} setData={setData} onSave={onSave} onDelete={onDelete}/>}
        {view==="cases"    &&<CaseList  data={data} setData={setData} onSave={onSave} onDelete={onDelete}/>}
        {view==="consult"  &&<ConsultPage data={data} setData={setData} onSave={onSave} onDelete={onDelete} userName={userName}/>}
        {view==="resources"&&<ResourceList data={data} setData={setData} onSave={onSave} onDelete={onDelete}/>}
        {view==="diary"    &&<DiaryLog  data={data} setData={setData} onSave={onSave} onDelete={onDelete}/>}
        {view==="monthly"  &&<MonthlyReport data={data} setData={setData} onSave={onSave} onDelete={onDelete} userName={userName}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
