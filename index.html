function TimePicker({value,onChange,placeholder="選擇時間"}){
  const [open,setOpen]=useState(false);
  const [inputVal,setInputVal]=useState("");
  const [pos,setPos]=useState({x:0,y:0,up:false});
  const ref=useRef(null);
  const inputRef=useRef(null);
  const pad=n=>String(n).padStart(2,"0");

  const times=[];
  for(let h=0;h<24;h++)for(let m=0;m<60;m+=5)times.push(`${pad(h)}:${pad(m)}`);

  const fmt=(t)=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return`${h<12?"上午":"下午"}${h%12===0?12:h%12}:${pad(m)}`;};

  // 過濾選項：依輸入文字篩選
  const filtered=inputVal
    ? times.filter(t=>fmt(t).includes(inputVal)||t.includes(inputVal))
    : times;

  useEffect(()=>{
    if(!open)return;
    const close=(e)=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setInputVal("");}};
    document.addEventListener("mousedown",close);
    return()=>document.removeEventListener("mousedown",close);
  },[open]);

  useEffect(()=>{
    if(open&&!inputVal&&ref.current){
      const sel=ref.current.querySelector(".sel-t");
      if(sel)sel.scrollIntoView({block:"center"});
    }
  },[open]);

  const handleFocus=(e)=>{
    const r=e.currentTarget.getBoundingClientRect();
    const up=window.innerHeight-r.bottom<240;
    setPos({x:r.left,y:up?r.top-4:r.bottom+4,up});
    setOpen(true);
    setInputVal("");
  };

  const handleInput=(e)=>{
    setInputVal(e.target.value);
    setOpen(true);
  };

  const select=(t)=>{
    onChange(t);
    setInputVal("");
    setOpen(false);
  };

  const displayVal=open?inputVal:(value?fmt(value):"");

  return(
    <div style={{position:"relative"}} ref={ref}>
      <div style={{...inp(),display:"flex",alignItems:"center",padding:0,overflow:"hidden"}}>
        <input ref={inputRef}
          value={displayVal}
          onChange={handleInput}
          onFocus={handleFocus}
          placeholder={placeholder}
          style={{flex:1,border:"none",outline:"none",background:"transparent",fontSize:14,fontFamily:font,color:C.text,padding:"8px 12px"}}/>
        {value&&!open
          ? <button onClick={e=>{e.stopPropagation();onChange("");}} style={{background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:13,padding:"0 10px",flexShrink:0}}>✕</button>
          : <span style={{fontSize:11,color:C.muted,padding:"0 10px",flexShrink:0}}>▾</span>
        }
      </div>
      {open&&filtered.length>0&&(
        <div style={{position:"fixed",left:pos.x,top:pos.up?undefined:pos.y,bottom:pos.up?(window.innerHeight-pos.y):undefined,
          zIndex:3000,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,
          boxShadow:"0 6px 24px rgba(0,0,0,0.15)",width:150,maxHeight:220,overflowY:"auto"}}>
          {filtered.map(t=>(
            <div key={t} className={value===t?"sel-t":""} onMouseDown={()=>select(t)}
              style={{padding:"10px 16px",fontSize:14,cursor:"pointer",
                background:value===t?C.primary:"transparent",
                color:value===t?"#fff":C.text,fontWeight:value===t?600:400}}>
              {fmt(t)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CalendarView({data,setData,onSave,onDelete}){
  const today=toDay();
  // ── 所有 hooks 集中在最頂部 ──────────────────────────
  const [cur,setCur]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [sel,setSel]=useState(today);
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [viewId,setViewId]=useState(null);
  const [menuId,setMenuId]=useState(null);
  const [menuPos,setMenuPos]=useState({x:0,y:0});
  const [form,setForm]=useState({title:"",type:"訪視",time:"",note:""});
  const initDone=useRef(false);

  // 點選其他地方關閉選單
  useEffect(()=>{
    if(!menuId)return;
    const close=()=>setMenuId(null);
    document.addEventListener("click",close);
    return()=>document.removeEventListener("click",close);
  },[menuId]);
  const thisYear=new Date().getFullYear();
  const holidays=useHolidays([thisYear,thisYear+1]);

  useEffect(()=>{
    if(initDone.current)return;
    if((data.events||[]).length===0){
      initDone.current=true;
      const newEvts=TAIWAN_HOLIDAYS.map(h=>({id:uid(),date:h.date,title:h.title,type:"節日",time:"",note:""}));
      setData(d=>({...d,events:newEvts}));
      newEvts.forEach(e=>onSave("events",e));
    }
  },[data.events]);

  // ── 一般函式 ──────────────────────────────────────────
  const blank={title:"",type:"訪視",timeStart:"",timeEnd:"",note:""};
  const fld=(k,v)=>setForm(f=>({...f,[k]:v}));

  const loadHolidays=async()=>{
    const existing=(data.events||[]).filter(e=>e.type!=="節日");
    const newEvts=TAIWAN_HOLIDAYS.map(h=>({id:uid(),date:h.date,title:h.title,type:"節日",time:"",note:""}));
    setData(d=>({...d,events:[...existing,...newEvts]}));
    for(const e of newEvts){await onSave("events",e);}
  };

  const clearHolidays=async()=>{
    if(!confirm("確定清除所有國定假日？"))return;
    const toRemove=(data.events||[]).filter(e=>e.type==="節日");
    setData(d=>({...d,events:(d.events||[]).filter(e=>e.type!=="節日")}));
    for(const e of toRemove){await onDelete("events",e.id);}
  };

  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const firstDow=(y,m)=>new Date(y,m,1).getDay();
  const totalDays=daysInMonth(cur.y,cur.m);
  const startDow=firstDow(cur.y,cur.m);
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=totalDays;d++)cells.push(d);

  const pad=n=>String(n).padStart(2,"0");
  const dateStr=(d)=>`${cur.y}-${pad(cur.m+1)}-${pad(d)}`;
  const evtsOn=(date)=>(data.events||[]).filter(e=>e.date===date);
  const visitsOn=(date)=>data.visits.filter(v=>v.nextVisit===date);

  const prevMonth=()=>setCur(c=>{const m=c.m-1;return m<0?{y:c.y-1,m:11}:{y:c.y,m};});
  const nextMonth=()=>setCur(c=>{const m=c.m+1;return m>11?{y:c.y+1,m:0}:{y:c.y,m};});
  const goToday=()=>{const d=new Date();setCur({y:d.getFullYear(),m:d.getMonth()});setSel(today);};

  const saveEvt=async()=>{
    if(!form.title.trim()){alert("請填寫事件標題");return;}
    const evt={...form,date:sel,id:uid()};
    setData(d=>({...d,events:[...(d.events||[]),evt]}));
    await onSave("events",evt);
    setForm(blank);setShowForm(false);
  };

  const delEvt=async(id)=>{
    if(!confirm("確定刪除？"))return;
    setData(d=>({...d,events:(d.events||[]).filter(e=>e.id!==id)}));
    await onDelete("events",id);
  };

  const startEdit=(e)=>{
    setEditId(e.id);
    setForm({title:e.title,type:e.type,date:e.date||"",timeStart:e.timeStart||"",timeEnd:e.timeEnd||"",note:e.note||""});
    setShowForm(false);
  };
  const cancelEdit=()=>{setEditId(null);setForm(blank);};
  const saveEdit=async()=>{
    if(!form.title.trim()){alert("請填寫事件標題");return;}
    const updated={...(data.events||[]).find(e=>e.id===editId),...form,id:editId,date:form.date||(data.events||[]).find(e=>e.id===editId)?.date};
    setData(d=>({...d,events:(d.events||[]).map(e=>e.id===editId?updated:e)}));
    await onSave("events",updated);
    setEditId(null);setForm(blank);
  };

  const selEvts=[...(evtsOn(sel))].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const selVisits=visitsOn(sel);
  const rocYear=cur.y-1911;

  return(
    <div>
      {/* 頂部 */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <h1 style={{fontSize:22,fontWeight:700,fontFamily:serif,color:C.text,margin:0}}>{rocYear} 年 {cur.m+1} 月</h1>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          
          <button onClick={goToday} style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:12,cursor:"pointer",fontFamily:font}}>今天</button>
          <button onClick={prevMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <button onClick={nextMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>
      </div>

      {/* 月曆 */}
      <div style={{border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:C.cardAlt,borderBottom:`1px solid ${C.border}`}}>
          {["日","一","二","三","四","五","六"].map((d,i)=>(
            <div key={d} style={{textAlign:"center",fontSize:13,fontWeight:700,color:i===0?"#C04040":i===6?"#4A6E8A":C.muted,padding:"10px 0"}}>{d}</div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gridAutoRows:"minmax(120px,auto)"}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={`e${i}`} style={{borderRight:`1px solid ${C.border}`,borderBottom:`1px solid ${C.border}`,minHeight:90}}/>;
            const ds=dateStr(d);
            const evts=evtsOn(ds);
            const vis=visitsOn(ds);
            const isToday=ds===today;
            const isSel=ds===sel;
            const colIdx=(startDow+d-1)%7;
            const isSun=colIdx===0,isSat=colIdx===6;
            const holiday=holidays[ds];
            return(
              <div key={d} onClick={()=>{setSel(ds);setEditId(null);setShowForm(false);}}
                style={{height:"100%",padding:"6px 8px",cursor:"pointer",overflow:"hidden",
                  borderRight:`1px solid ${C.border}`,borderBottom:`1px solid ${C.border}`,
                  background:isSel?"#EBF4F0":isToday?"#FFF8F0":C.card,
                  outline:isSel?`2px solid ${C.primary}`:"none",outlineOffset:-2}}>
                <div style={{fontSize:14,fontWeight:isToday||isSel?700:500,
                  color:isSun?"#C04040":isSat?"#4A6E8A":isSel?C.primary:isToday?C.accent:C.text,
                  marginBottom:holiday?1:4}}>{d}</div>
                {holiday&&<div style={{fontSize:11,color:"#C04040",fontWeight:600,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{holiday}</div>}
                {(()=>{
                  const localEvts=evts.filter(e=>e.type!=="節日");
                  const gEvts=[];
                  const allEvts=[...localEvts.map(e=>({...e,_src:"local"})),...gEvts.map(e=>({...e,_src:"gcal"}))];
                  const shown=allEvts.slice(0,3);
                  const restN=allEvts.length-shown.length+(vis.length>0&&allEvts.length<3?0:vis.length>0?1:0);
                  return(
                    <div style={{display:"flex",flexDirection:"column",gap:2}}>
                      {shown.map((ev,idx)=>ev._src==="gcal"?(
                        <div key={"g"+idx} style={{borderRadius:3,background:"#4285F4",
                          padding:"3px 6px",fontSize:12,color:"#fff",fontWeight:500,
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",lineHeight:"18px"}}>
                          {ev.title}
                        </div>
                      ):(
                        <div key={ev.id} style={{borderRadius:3,background:EVT_COLORS[ev.type]||C.muted,
                          padding:"3px 6px",fontSize:12,color:"#fff",fontWeight:600,
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",lineHeight:"18px"}}>
                          {ev.title}
                        </div>
                      ))}
                      {allEvts.length<3&&vis.length>0&&<div style={{borderRadius:3,background:"#AAB8C2",padding:"3px 6px",fontSize:12,color:"#fff",fontWeight:600,lineHeight:"18px"}}>預排訪視</div>}
                      {restN>0&&<div
                        onClick={ev=>{ev.stopPropagation();setSel(ds);setEditId(null);setShowForm(false);setTimeout(()=>{const el=document.querySelector(".detail-panel");if(el){el.scrollIntoView({behavior:"smooth",block:"nearest"});el.style.outline="2px solid "+C.primary;setTimeout(()=>el.style.outline="",1000);}},200);}}
                        style={{fontSize:11,color:C.primary,lineHeight:"18px",fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>
                        還有 {restN} 個
                      </div>}
                    </div>
                  );
                })()}
              </div>
            );
          })}
        </div>
      </div>

      {/* 圖例 */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        {EVT_TYPES.map(t=>(<div key={t} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:C.muted}}><div style={{width:8,height:8,borderRadius:"50%",background:EVT_COLORS[t]}}/>{t}</div>))}
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:C.muted}}><div style={{width:8,height:8,borderRadius:"50%",background:"#AAB8C2"}}/>預排訪視</div>
      </div>

      {/* 選取日詳情 */}
      <div className="detail-panel" style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",background:C.cardAlt,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:15,fontWeight:700,color:C.text}}>{fmtDate(sel)}</span>
            <span style={{fontSize:12,color:C.muted}}>{new Date(sel+"T00:00:00").toLocaleDateString("zh-TW",{weekday:"long"})}</span>
            {selEvts.filter(e=>e.type!=="節日").length>0&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#EEF7F3",color:C.primary}}>{selEvts.filter(e=>e.type!=="節日").length} 個行程</span>}
          </div>
          <Btn onClick={()=>{setShowForm(v=>!v);setForm(blank);setEditId(null);}} variant={showForm?"secondary":"primary"} style={{padding:"6px 16px",fontSize:12}}>
            {showForm?"取消":"＋ 新增"}
          </Btn>
        </div>
        <div style={{padding:"14px 20px",overflowX:"visible"}}>
          {showForm&&(
            <div style={{background:C.cardAlt,borderRadius:10,padding:"16px",marginBottom:14,border:`1px solid ${C.border}`}}>
              <div style={{marginBottom:10}}><Label>標題 *</Label><input value={form.title} onChange={e=>fld("title",e.target.value)} placeholder="事件標題" style={inp()}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <div style={{gridColumn:"span 2"}}><Label>類型</Label><select value={form.type} onChange={e=>fld("type",e.target.value)} style={inp()}>{EVT_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
                <div><Label>開始時間</Label><TimePicker value={form.timeStart||""} onChange={v=>fld("timeStart",v)}/></div>
                <div><Label>結束時間</Label><TimePicker value={form.timeEnd||""} onChange={v=>fld("timeEnd",v)}/></div>
              </div>
              <div style={{marginBottom:12}}><Label>備註</Label><textarea value={form.note} onChange={e=>fld("note",e.target.value)} rows={2} style={{...inp(),resize:"vertical"}}/></div>
              <Btn onClick={saveEvt} style={{width:"100%"}}>儲存事件</Btn>
            </div>
          )}
          {selVisits.map(v=>(
            <div key={v.id} style={{background:"#F0F4F8",borderRadius:10,border:"1px solid #C8D8E8",padding:"12px 14px",marginBottom:8,borderLeft:"3px solid #5B8DB8"}}>
              <div style={{fontSize:11,fontWeight:600,color:"#5B8DB8",marginBottom:4}}>📅 預排訪視</div>
              <div style={{fontSize:13,color:C.text,fontWeight:500}}>{data.cases.find(c=>c.id===v.caseId)?.name||"（未知）"}</div>
              {v.followup&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{v.followup}</div>}
            </div>
          ))}
          {selEvts.filter(e=>e.type!=="節日").length===0&&selVisits.length===0&&!showForm&&(
            <div style={{fontSize:13,color:C.muted,textAlign:"center",padding:"24px 0"}}>這天沒有安排<br/><span style={{fontSize:11}}>點「＋ 新增」來加入事件</span></div>
          )}
          {selEvts.filter(e=>e.type!=="節日").map(e=>(
            <div key={e.id} style={{background:C.card,borderRadius:10,border:`1.5px solid ${editId===e.id?C.primary:C.border}`,padding:"12px 14px",marginBottom:8,borderLeft:`3px solid ${EVT_COLORS[e.type]||C.muted}`,position:"relative"}}>
              {editId===e.id?(
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:C.primary,marginBottom:10}}>編輯事件</div>
                  <div style={{marginBottom:8}}><Label>日期</Label><input type="date" value={form.date||""} onChange={ev=>fld("date",ev.target.value)} style={inp()}/></div>
                  <div style={{marginBottom:8}}><Label>標題 *</Label><input value={form.title} onChange={ev=>fld("title",ev.target.value)} style={inp()}/></div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div style={{gridColumn:"span 2"}}><Label>類型</Label><select value={form.type} onChange={ev=>fld("type",ev.target.value)} style={inp()}>{EVT_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
                    <div><Label>開始時間</Label><TimePicker value={form.timeStart||""} onChange={v=>fld("timeStart",v)}/></div>
                    <div><Label>結束時間</Label><TimePicker value={form.timeEnd||""} onChange={v=>fld("timeEnd",v)}/></div>
                  </div>
                  <div style={{marginBottom:10}}><Label>備註</Label><textarea value={form.note} onChange={ev=>fld("note",ev.target.value)} rows={2} style={{...inp(),resize:"vertical"}}/></div>
                  <div style={{display:"flex",gap:8}}>
                    <Btn onClick={saveEdit} style={{flex:1,padding:"7px"}}>儲存</Btn>
                    <Btn variant="secondary" onClick={cancelEdit} style={{padding:"7px 12px"}}>取消</Btn>
                  </div>
                </div>
              ):(
                <div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1,cursor:"pointer"}} onClick={()=>setViewId(v=>v===e.id?null:e.id)}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                        <span style={{fontSize:13,fontWeight:600,color:C.text}}>{e.title}</span>
                        <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:(EVT_COLORS[e.type]||C.muted)+"22",color:EVT_COLORS[e.type]||C.muted,fontWeight:600}}>{e.type}</span>
                      </div>
                      {(e.timeStart||e.timeEnd)&&<div style={{fontSize:11,color:C.muted}}>🕐 {e.timeStart||""}{e.timeEnd?` - ${e.timeEnd}`:""}</div>}
                    </div>
                    <div style={{flexShrink:0,paddingLeft:8,position:"relative"}}>
                      <button onClick={ev=>{ev.stopPropagation();const r=ev.currentTarget.getBoundingClientRect();setMenuPos({x:r.right,y:r.bottom});setMenuId(v=>v===e.id?null:e.id);}}
                        style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,cursor:"pointer",color:menuId===e.id?C.primary:C.muted,fontSize:13,padding:"2px 8px",lineHeight:1}}>⋮</button>
                      {menuId===e.id&&(
                        <div onClick={ev=>ev.stopPropagation()}
                          style={{position:"fixed",left:Math.min(menuPos.x-130,window.innerWidth-140),top:menuPos.y+140>window.innerHeight?menuPos.y-148:menuPos.y+4,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,boxShadow:"0 8px 28px rgba(0,0,0,0.18)",zIndex:2000,minWidth:130,overflow:"hidden"}}>
                          <button onClick={()=>{startEdit(e);setMenuId(null);}}
                            style={{width:"100%",padding:"11px 18px",background:"none",border:"none",cursor:"pointer",fontSize:13,fontFamily:font,color:C.text,textAlign:"left",display:"flex",alignItems:"center",gap:9}}>✏️ 編輯</button>
                          <button onClick={()=>{const copy={...e,id:uid(),title:`${e.title}（複製）`};setData(d=>({...d,events:[...d.events,copy]}));onSave("events",copy);setMenuId(null);}}
                            style={{width:"100%",padding:"11px 18px",background:"none",border:"none",cursor:"pointer",fontSize:13,fontFamily:font,color:C.text,textAlign:"left",display:"flex",alignItems:"center",gap:9,borderTop:`1px solid ${C.border}`}}>⧉ 複製</button>
                          <button onClick={()=>{delEvt(e.id);setMenuId(null);}}
                            style={{width:"100%",padding:"11px 18px",background:"none",border:"none",cursor:"pointer",fontSize:13,fontFamily:font,color:C.danger,textAlign:"left",display:"flex",alignItems:"center",gap:9,borderTop:`1px solid ${C.border}`}}>✕ 刪除</button>
                        </div>
                      )}
                    </div>
                  </div>

                  {viewId===e.id&&(
                    <div style={{marginTop:10,padding:"10px 12px",background:C.cardAlt,borderRadius:8,fontSize:12,color:C.text,lineHeight:1.8}}>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:4}}>
                        <span style={{color:C.muted}}>📅</span><span style={{fontWeight:500}}>{fmtDate(e.date)}</span>
                        {(e.timeStart||e.timeEnd)&&<span style={{color:C.muted}}>🕐 {e.timeStart||""}{e.timeEnd?` - ${e.timeEnd}`:""}</span>}
                      </div>
                      {e.note?<div style={{color:C.muted,whiteSpace:"pre-wrap"}}>{e.note}</div>:<div style={{color:C.border}}>（無備註）</div>}
                    </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}



// ── CASE RECORDS MODAL ──────────────────────────────────────────
const CONTACT_METHODS=["電訪","家訪","晤談","外訪","代辦","陪同","簡訊","個研","函件","其他"];
const CONTACT_METHOD_COLOR={"電訪":"#E8F0FB","家訪":"#E8F5EE","晤談":"#F0EBF8","外訪":"#FFF0E8","代辦":"#FFF8E0","陪同":"#E8F8F0","簡訊":"#FFF4E8","個研":"#EBF0FF","函件":"#F5EDE8","其他":"#F0F0EE"};
const CONTACT_METHOD_TEXT={"電訪":"#3A5FAA","家訪":"#2A7A4A","晤談":"#6A3A9A","外訪":"#9A4A1A","代辦":"#8A6A10","陪同":"#1A7A5A","簡訊":"#AA6020","個研":"#2A4A9A","函件":"#7A4A2A","其他":C.muted};

function CaseRecordsModal({caseData,caseRecords,setData,onSave,onDelete,onClose}){
  const records=[...(caseRecords||[]).filter(r=>r.caseId===caseData.id)]
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  const blank={date:toDay(),contactPerson:"",resourceUnit:"",contactMethod:"電訪",contactCount:"1",serviceCount:"1",content:"",serviceLocation:"",timeRange:""};
  const [showAdd,setShowAdd]=useState(false);
  const [addRec,setAddRec]=useState(blank);
  const [editId,setEditId]=useState(null);
  const [editRec,setEditRec]=useState({});
  const [page,setPage]=useState(1);
  const [viewRec,setViewRec]=useState(null);
  const PAGE=10;
  const totalPages=Math.max(1,Math.ceil(records.length/PAGE));
  const paged=records.slice((page-1)*PAGE,page*PAGE);

  const fldAdd=(k,v)=>setAddRec(r=>({...r,[k]:v}));
  const fldEdit=(k,v)=>setEditRec(r=>({...r,[k]:v}));

  const handleAdd=async()=>{
    if(!addRec.contactPerson.trim()&&!addRec.content.trim()){alert("請填寫聯繫對象或聯繫內容");return;}
    const item={...addRec,id:uid(),caseId:caseData.id,createdBy:(typeof currentUserName!=="undefined"?currentUserName:"社工"),createdDate:toDay(),createdAt:new Date().toISOString(),lastModified:toDay()};
    setData(d=>({...d,caseRecords:[...(d.caseRecords||[]),item]}));
    await onSave("caseRecords",item);
    setAddRec(blank);setShowAdd(false);
  };
  const handleEdit=async()=>{
    const mrPersons=editRec.contactPersons||[];
    const mrType=mrPersons.length>0?mrPersons.map(p=>p.type).join("、"):editRec.contactPersonType||"";
    const mrName=mrPersons.length>0?mrPersons.map(p=>p.name).filter(Boolean).join("、"):editRec.contactPerson||"";
    const updated={...editRec,contactPersons:mrPersons,contactPersonType:mrType,contactPerson:mrName,lastModified:toDay()};
    setData(d=>({...d,caseRecords:(d.caseRecords||[]).map(r=>r.id===editId?updated:r)}));
    await onSave("caseRecords",updated);
    setEditId(null);
  };
  const handleDel=async(id)=>{
    if(!confirm("確定刪除此筆紀錄？"))return;
    setData(d=>({...d,caseRecords:(d.caseRecords||[]).filter(r=>r.id!==id)}));
    await onDelete("caseRecords",id);
  };

  const MethodBadge=({m})=>(
    <span style={{padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:600,
      background:CONTACT_METHOD_COLOR[m]||"#EEE",color:CONTACT_METHOD_TEXT[m]||C.muted}}>
      {m}
    </span>
  );

  // 行內編輯列
  // EditRow inlined below to prevent focus loss

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(26,51,50,0.55)",zIndex:1500,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"24px 16px"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"min(1040px,98vw)",boxShadow:"0 20px 60px rgba(0,0,0,0.25)",overflow:"hidden"}}>

        {/* ── Header ── */}
        <div style={{background:C.sidebar,padding:"20px 28px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",letterSpacing:"0.12em",marginBottom:4}}>個案聯繫紀錄</div>
            <div style={{fontSize:18,fontWeight:700,color:"#fff",fontFamily:serif}}>{caseData.name}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:2}}>
              {caseData.caseNo||"—"}
              {caseData.status&&<span style={{marginLeft:8,padding:"1px 8px",borderRadius:10,background:"rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)"}}>{caseData.status}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <div style={{display:"flex",gap:12,fontSize:12,color:"rgba(255,255,255,0.5)"}}>
              <span>共 {records.length} 筆紀錄</span>
              {records.length>0&&<span>最近：{fmtDate(records[0]?.date)}</span>}
            </div>
            <button onClick={()=>{setShowAdd(v=>!v);setEditId(null);}}
              style={{padding:"8px 18px",borderRadius:8,background:"rgba(201,123,58,0.85)",border:"none",color:"#fff",cursor:"pointer",fontSize:13,fontFamily:font,fontWeight:600}}>
              {showAdd?"取消":"＋ 新增紀錄"}
            </button>
            <button onClick={onClose} style={{background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",borderRadius:8,width:34,height:34,cursor:"pointer",fontSize:17,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>

        {/* ── 新增紀錄表單 ── */}
        {showAdd&&(
          <div style={{padding:"18px 24px",background:"#F8F5F0",borderBottom:`2px solid ${C.border}`}}>
            <div style={{fontSize:13,fontWeight:600,color:C.text,marginBottom:14}}>新增聯繫紀錄</div>
            <div style={{display:"grid",gridTemplateColumns:"130px 1fr 1fr auto auto",gap:"10px 12px",alignItems:"end",marginBottom:12}}>
              <div>
                <Label>日期</Label>
                <input type="date" value={addRec.date} onChange={e=>fldAdd("date",e.target.value)} style={inp()}/>
              </div>
              <div>
                <Label>聯繫對象</Label>
                <input value={addRec.contactPerson} onChange={e=>fldAdd("contactPerson",e.target.value)} placeholder="個案本人、家屬、單位…" style={inp()}/>
              </div>
              <div>
                <Label>資源聯繫單位</Label>
                <input value={addRec.resourceUnit} onChange={e=>fldAdd("resourceUnit",e.target.value)} placeholder="留空表示無" style={inp()}/>
              </div>
              <div>
                <Label>聯繫方式</Label>
                <select value={addRec.contactMethod} onChange={e=>{const v=e.target.value;fldAdd("contactMethod",v);if(v==="家訪"&&!addRec.serviceLocation)fldAdd("serviceLocation","案家");}} style={inp()}>
                  {CONTACT_METHODS.map(m=><option key={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <Label>聯繫次數</Label>
                <input type="number" min="1" value={addRec.contactCount} onChange={e=>fldAdd("contactCount",e.target.value)} style={{...inp(),width:72}}/>
              </div>
              <div>
                <Label>服務人次</Label>
                <input type="number" min="1" value={addRec.serviceCount||"1"} onChange={e=>fldAdd("serviceCount",e.target.value)} style={{...inp(),width:72}}/>
              </div>
            </div>
            {["家訪","晤談","外訪","陪同"].includes(addRec.contactMethod)&&(
              <div style={{marginBottom:12,padding:"8px 12px",background:C.cardAlt,borderRadius:8,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:500}}>服務時間</div>
                <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                  {["1-119分","120分以上"].map(t=>(
                    <label key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:13,cursor:"pointer",color:C.text}}>
                      <input type="radio" name="add-tr" checked={addRec.timeRange===t} onChange={()=>fldAdd("timeRange",t)}/>
                      訪視會談 {t}
                    </label>
                  ))}
                </div>
              </div>
            )}
            {addRec.contactMethod==="電訪"&&(
              <div style={{marginBottom:12,padding:"8px 12px",background:C.cardAlt,borderRadius:8,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:500}}>服務時間</div>
                <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                  {["1-9分","10-19分","20分以上"].map(t=>(
                    <label key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:13,cursor:"pointer",color:C.text}}>
                      <input type="radio" name="add-tr" checked={addRec.timeRange===t} onChange={()=>fldAdd("timeRange",t)}/>
                      電話 {t}
                    </label>
                  ))}
                </div>
              </div>
            )}
            <div style={{marginBottom:12}}>
              <Label>服務地點</Label>
              <select value={addRec.serviceLocation||""} onChange={e=>fldAdd("serviceLocation",e.target.value)} style={inp()}>
                <option value="">選擇地點...</option>
                <option value="本機構">本機構</option>
                <option value="案家">案家</option>
                <option value="外機構">外機構</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div style={{marginBottom:12}}>
              <Label>聯繫內容</Label>
              <textarea value={addRec.content} onChange={e=>fldAdd("content",e.target.value)}
                placeholder="記錄本次聯繫的重點、狀況、後續追蹤事項…"
                rows={3} style={{...inp(),resize:"vertical",lineHeight:1.7}}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={handleAdd}>💾 儲存紀錄</Btn>
              <Btn variant="secondary" onClick={()=>setShowAdd(false)}>取消</Btn>
            </div>
          </div>
        )}

        {/* ── 聯繫統計小結 ── */}
      {records.length>0&&(()=>{
        const byMethod={};
        records.forEach(r=>{byMethod[r.contactMethod]=(byMethod[r.contactMethod]||0)+parseInt(r.contactCount||1);});
        const totalCount=records.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
        return(
          <div style={{display:"flex",gap:12,padding:"12px 28px",background:"#F8F5F0",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:12,color:C.muted,fontWeight:600}}>聯繫統計：</span>
            <span style={{fontSize:12,color:C.text}}>總次數 <strong style={{color:C.primary}}>{totalCount}</strong></span>
            {Object.entries(byMethod).map(([m,n])=>(
              <span key={m} style={{fontSize:12,padding:"2px 10px",borderRadius:20,background:CONTACT_METHOD_COLOR[m]||"#EEE",color:CONTACT_METHOD_TEXT[m]||C.muted}}>
                {m} {n}次
              </span>
            ))}
          </div>
        );
      })()}

      {/* ── 表格 ── */}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:C.cardAlt,borderBottom:`2px solid ${C.border}`}}>
                {["日期","聯繫對象","資源聯繫單位","聯繫方式","次數","動作"].map(h=>(
                  <th key={h} style={{padding:"11px 14px",textAlign:"left",color:C.muted,fontWeight:600,fontSize:12,whiteSpace:"nowrap",borderBottom:`1px solid ${C.border}`}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {records.length===0&&(
                <tr><td colSpan={6} style={{padding:"40px",textAlign:"center",color:C.muted,fontSize:13}}>
                  尚無聯繫紀錄，點擊上方「＋ 新增紀錄」開始記錄
                </td></tr>
              )}
              {paged.map((r,i)=>(
                editId===r.id

// ── MONTHLY REPORT ───────────────────────────────────────────────
// ── 資源總冊：模糊搜尋、讀檔、挑選視窗（資源聯繫紀錄表用）──────────
// 常見縮寫：搜尋時同時用展開後的寫法比對
const RB_ABBR=[["社福","社會福利"],["身障","身心障礙"],["長照","長期照顧"],["心衛","心理衛生"],["衛福部","衛生福利部"],["社局","社會局"],["家暴","家庭暴力"],["早療","早期療育"],["精障","精神障礙"],["智障","智能障礙"],["聽障","聽覺障礙"],["日照","日間照顧"],["居服","居家服務"],["家托","家庭托顧"],["社宅","社會住宅"],["就服","就業服務"],["職重","職業重建"],["健保","健康保險"],["國保","國民年金"],["低收","低收入"]];
const RB_NOISE=/臺北市政府|臺北市|新北市|醫療社團法人|財團法人|社團法人/g;
function rbNorm(s){
  return String(s||"").normalize("NFKC").replace(/台/g,"臺").toLowerCase()
    .replace(/[\s　·・.,，、。:：;；'"“”‘’「」『』()\[\]【】{}<>《》〈〉\/\\|!！?？#＃@&+＊*~\-－—_=]/g,"");
}
function rbLcs(a,b){
  const m=a.length,n=b.length;if(!m||!n)return 0;
  let prev=new Array(n+1).fill(0),cur=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++)cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function rbVariants(t){
  const vs=new Set([t]);
  let ex=t;RB_ABBR.forEach(([a,b])=>{ex=ex.split(a).join(b);});
  vs.add(ex);
  [...vs].forEach(v=>{const s=v.replace(RB_NOISE,"");if(s)vs.add(s);});
  return[...vs];
}
// 一個關鍵字對一筆資源：tier 0=名稱直接包含 1=名稱近似 2=只在類別或說明找到；frac=吻合比例
function rbMatchTerm(vs,raw,e){
  let best=null;
  for(const v of vs){
    if(e._n.includes(v))return{tier:0,frac:1};
    if(v.length<2)continue;
    const allow=Math.floor((v.length-1)/4);
    const l=rbLcs(v,e._n);
    if(l>=2&&l>=v.length-allow){
      const f=l/v.length;
      if(!best||f>best.frac)best={tier:1,frac:f};
    }
  }
  if(best)return best;
  if(e._s.includes(raw))return{tier:2,frac:1};
  return null;
}
function rbPrep(e){return{...e,_n:rbNorm(e.name),_s:rbNorm((e.big||"")+(e.sub||"")+(e.desc||""))};}
function rbSearch(list,q,limit=60){
  const terms=String(q||"").split(/\s+/).map(rbNorm).filter(Boolean).map(t=>({raw:t,vs:rbVariants(t)}));
  if(!terms.length)return[];
  const out=[];
  list.forEach(e=>{
    let tier=0,frac=1;
    for(const t of terms){const m=rbMatchTerm(t.vs,t.raw,e);if(!m)return;tier=Math.max(tier,m.tier);frac=Math.min(frac,m.frac);}
    out.push({e,tier,frac});
  });
  out.sort((a,b)=>a.tier-b.tier||b.frac-a.frac||a.e._n.length-b.e._n.length);
  return out.slice(0,limit).map(x=>({...x.e,_tier:x.tier,_frac:x.frac}));
}
// 比對用的鍵：忽略換行和前後空白；輸出時一律用總冊原文
function rbKey(name,big,sub){return[name,big,sub].map(x=>String(x||"").replace(/\s+/g," ").trim()).join("||");}
function rbOneLine(s){return String(s||"").replace(/\s*\n\s*/g," ").trim();}
function rbSerial(ymd){const[y,m,d]=String(ymd||"").split("-").map(Number);if(!y||!m||!d)return null;return(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000;}

// 資源聯繫紀錄表 19 欄表頭，照原表一字不改
const RC_HEAD=["個案類型","個案\n(全名)","資源名稱\n(請至總冊查詢後複製並貼入欄位中)\n有新單位請回總冊填寫","需求連結\n大類\n(公式代入)","需求連結\n小項\n(公式代入)","聯繫內容說明\n(以個案為單位進行聯繫簡述 EX:身障鑑定聯繫，如有議題變更，請再補充)","聯繫日期\n(月份)","聯繫次數","1 資源連結可及時回應個案需求","2 資源單位提供之服務更加豐富多元","3 資源單位服務積極","4 資源申請資訊不明確","5 資源已終止服務","6 資源申請耗時過長(需等候一個月以上)","7 資源單位在服務上較被動","8 資源使用有時間限制","9 其他\n(請在說明欄位備註)","說明\n(有填\"9-其他\"，才需要備註)","社工員"];
const RB_EVALS=RC_HEAD.slice(8,17).map(h=>h.split("\n")[0]);
// 總冊欄位辨識：依表頭文字找欄
const RB_ROLES=[["cat",h=>h.startsWith("類別")],["name",h=>h.startsWith("單位名稱")],["big",h=>h==="大類別"],["sub",h=>h==="子類別"],["desc",h=>h.startsWith("說明")],["legal",h=>h.startsWith("法定評估")],["form",h=>h==="表單"],["url",h=>h==="網址"],["created",h=>h.startsWith("建檔日期")],["updated",h=>h.startsWith("更新日")]];
const RB_ROLE_ORDER=["cat","name","big","sub","desc","legal","form","url","created","updated"];
const RB_DEFAULT_HEAD=["類別\n非正式資源\n正式資源","單位名稱\n(如有橫跨多種類別，單位名稱請依照以下格式分列，以利於公式辨識，範例：「A單位名稱(服務內容)」","大類別","子類別","說明\n必填項目：#負責人/聯電#地址#服務區域#說明(自由補充)","法定評估\n長照失能評估\n需求中心評估","表單","網址","建檔日期\n(西元/月/日)","更新日\n(西元/月/日)"];

function rbParseWorkbook(wb){
  const XL=window.XLSX;
  const names=[...wb.SheetNames].sort((a,b)=>(b.trim()==="資源總冊")-(a.trim()==="資源總冊"));
  for(const sn of names){
    const rows=XL.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:true,blankrows:false});
    if(!rows.length)continue;
    const head=rows[0].map(h=>String(h??"").trim());
    const idx={};
    head.forEach((h,i)=>{RB_ROLES.forEach(([role,test])=>{if(idx[role]===undefined&&test(h))idx[role]=i;});});
    if(idx.name===undefined||idx.big===undefined||idx.sub===undefined)continue;
    // 共用檔的換行存成 CRLF，Excel 讀進來只有 LF；統一成 LF 才能跟總冊原文完全相同
    const val=(r,role)=>idx[role]===undefined?"":String(r[idx[role]]??"").replace(/\r\n?/g,"\n");
    const entries=[];
    rows.slice(1).forEach(r=>{
      const name=val(r,"name");
      if(!name.trim())return;
      entries.push(rbPrep({name,big:val(r,"big"),sub:val(r,"sub"),desc:val(r,"desc"),cat:val(r,"cat"),legal:val(r,"legal"),form:val(r,"form"),url:val(r,"url")}));
    });
    // 新增列要照總冊 A 到 J 欄的順序
    const colRoles=[];
    for(let i=0;i<10;i++)colRoles.push(Object.keys(idx).find(k=>idx[k]===i)||null);
    return{sheetName:sn,entries,head:rows[0].slice(0,10).map(h=>String(h??"").replace(/\r\n?/g,"\n")),colRoles};
  }
  throw new Error("找不到「資源總冊」工作表，或表頭沒有單位名稱、大類別、子類別");
}

        </div>
        {creating
          ?<NewBookEntryForm pool={pool} book={book} initName={q} onCancel={()=>setCreating(false)} onPickExisting={onPick} onCreate={async fields=>{const stay=await onCreate(fields);if(stay){setCreating(false);setQ(fields.name);}}}/>
          :<>
            <div style={{padding:"12px 18px 8px"}}>
              <input autoFocus value={q} onChange={e=>{setQ(e.target.value);setOpenKey(null);}} placeholder="輸入單位名稱的部分文字" style={inp({fontSize:14})}/>
              <div style={{fontSize:11,color:C.muted,marginTop:6}}>可以打縮寫或部分字，例如「萬華社福」；多個關鍵字用空白隔開，例如「西區輔具 租借」。</div>
            </div>
            <div style={{overflowY:"auto",flex:1,borderTop:`1px solid ${C.border}`}}>
              {!q.trim()&&<div style={{padding:"18px",fontSize:13,color:C.muted}}>總冊共 {(book?.entries||[]).length} 筆，輸入文字開始搜尋。</div>}
              {q.trim()&&results.length===0&&<div style={{padding:"18px",fontSize:13,color:C.muted}}>找不到符合的資源。{onCreate?"可以換個寫法再試，或按下方新增。":""}</div>}
              {results.map((e,i)=>{
                const k=rbKey(e.name,e.big,e.sub)+"#"+i;
                const open=openKey===k;
                return(
                  <div key={k} onClick={()=>onPick?onPick(e):setOpenKey(open?null:k)}
                    style={{borderBottom:`1px solid ${C.border}`,padding:"9px 18px",cursor:"pointer",background:open?"#F5F9FF":"transparent"}}>
                    <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14,fontWeight:600,color:C.text,lineHeight:1.5}}>
                          {rbOneLine(e.name)}
                          {e._isNew&&badge("新增待貼總冊","#FFF4E0",C.accent)}
                          {e._tier===1&&badge("近似","#F0F0EE",C.muted)}
                          {e._tier===2&&badge("類別或說明符合","#F0F0EE",C.muted)}
                        </div>
                        <div style={{fontSize:12,color:C.muted,marginTop:2}}>{rbOneLine(e.big)}　{rbOneLine(e.sub)}{e.cat?"　"+rbOneLine(e.cat):""}</div>
                        {open&&e.desc&&<div style={{fontSize:12,color:C.text,marginTop:6,padding:"6px 8px",background:C.cardAlt,borderRadius:6,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{e.desc}</div>}
                      </div>
                      {e.desc&&onPick&&<button onClick={ev=>{ev.stopPropagation();setOpenKey(open?null:k);}} style={{border:`1px solid ${C.border}`,background:C.card,borderRadius:6,fontSize:11,padding:"3px 8px",cursor:"pointer",color:C.muted,flexShrink:0}}>{open?"收起":"說明"}</button>}
                      {e._isNew&&onDeleteNew&&<button onClick={ev=>{ev.stopPropagation();if(confirm("刪除這筆新增資源？"))onDeleteNew(e._id);}} title="刪除" style={{border:"1px solid #E5C5C5",background:"#FFF4F4",borderRadius:6,fontSize:12,padding:"2px 8px",cursor:"pointer",color:"#C04545",flexShrink:0}}>×</button>}
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 18px",borderTop:`1px solid ${C.border}`}}>
              <span style={{fontSize:11,color:C.muted,flex:1}}>{results.length>=60?"只顯示最接近的 60 筆，再多打幾個字可以縮小範圍。":onPick?"點一筆就會選用。":"點一筆看說明。"}</span>
              {onCreate&&<Btn variant="accent" onClick={()=>setCreating(true)} style={{fontSize:12,padding:"6px 14px"}}>找不到？新增到總冊</Btn>}
            </div>
          </>}
      </div>
    </div>
  );
}

function MonthlyReport({data,setData,onSave,onDelete,userName}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth()+1);

  const pad=n=>String(n).padStart(2,"0");
  const monthStr=`${year}-${pad(month)}`;
  const rocYear=year-1911;
  const [editId,setEditId]=useState(null);
  const [filterMethod,setFilterMethod]=useState(null);
  const [searchQuery,setSearchQuery]=useState("");
  const [viewId,setViewId]=useState(null);
  const [showCheck,setShowCheck]=useState(false);
  const [showHomeVisit,setShowHomeVisit]=useState(false);
  const [showResources,setShowResources]=useState(false);
  const [showRecon,setShowRecon]=useState(false);
  const [expandedResource,setExpandedResource]=useState(null);
  // ── 資源總冊對應：總冊只放在瀏覽器記憶體，不存資料庫；對應關係存 resourceMap ──
  const [rbBook,setRbBook]=useState(()=>window._rbBookCache||null);
  const [rbErr,setRbErr]=useState("");
  const [rbLoading,setRbLoading]=useState(false);
  const [rbPicker,setRbPicker]=useState(null);
  const [rbDraft,setRbDraft]=useState({});
  const rbFileRef=useRef(null);
  const rbDraftKey=`swapp_resdraft_${getUid()||"local"}_${monthStr}`;
  useEffect(()=>{try{setRbDraft(JSON.parse(localStorage.getItem(rbDraftKey)||"{}"));}catch{setRbDraft({});}},[rbDraftKey]);
  useEffect(()=>{
    if(!showResources||data.resourceMap!==undefined)return;
    let alive=true;
    (async()=>{
      try{const list=await fbGet("resourceMap");if(alive)setData(d=>d.resourceMap!==undefined?d:{...d,resourceMap:list});}
      catch(e){console.error(e);if(alive){setRbErr("讀取總冊對應資料失敗："+e.message);setData(d=>d.resourceMap!==undefined?d:{...d,resourceMap:[]});}}
    })();
    return()=>{alive=false;};
  },[showResources]);
  const rbIndex=React.useMemo(()=>{
    const m=new Map();
    (rbBook?.entries||[]).forEach(e=>{const k=rbKey(e.name,e.big,e.sub);if(!m.has(k))m.set(k,e);});
    return m;
  },[rbBook]);
  const rbLoadFile=async(file)=>{
    if(!file)return;
    setRbErr("");setRbLoading(true);
    try{
      const buf=await file.arrayBuffer();
      const wb=window.XLSX.read(buf,{type:"array"});
      const parsed=rbParseWorkbook(wb);
      const b={...parsed,fileName:file.name,loadedAt:new Date()};
      window._rbBookCache=b;
      setRbBook(b);
    }catch(e){console.error(e);setRbErr("讀取失敗："+e.message);}
    finally{setRbLoading(false);}
  };
  const rbUpdDraft=(k,patch)=>setRbDraft(d=>{
    const n={...d,[k]:{...(d[k]||{}),...patch}};
    try{localStorage.setItem(rbDraftKey,JSON.stringify(n));}catch{}
    return n;
  });

  const exportExcel=()=>{
    const rows=[["日期","個案姓名","案號","聯繫對象","資源聯繫單位","聯繫方式","次數","聯繫內容"]];
    const recs=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr)).sort((a,b)=>a.date.localeCompare(b.date));
    recs.forEach(r=>{
      const c=data.cases.find(x=>x.id===r.caseId);
      rows.push([
        r.date||"",
        c?.name||"（未知）",
        c?.caseNo||"",
        r.contactPersonType?`${r.contactPersonType}${r.contactPerson?` ${r.contactPerson}`:""}`:r.contactPerson||"",
        r.resourceUnit||"",
        r.contactMethod||"",
        parseInt(r.contactCount||1),
        r.content||""
      ]);
    });
    // 加統計列
    rows.push([]);
    rows.push(["統計","聯繫筆數",recs.length,"服務人次",recs.reduce((s,r)=>s+parseInt(r.serviceCount||1),0)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    // 欄寬
    ws["!cols"]=[{wch:12},{wch:10},{wch:14},{wch:16},{wch:18},{wch:10},{wch:6},{wch:40}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,`${rocYear}年${MONTH_NAMES[month-1]}`);
    XLSX.writeFile(wb,`月服務報表_民${rocYear}年${MONTH_NAMES[month-1]}.xlsx`);
  };

  // ── 匯出政府月報表格式（完整欄位）──────────────────────────────
  const exportGovTable=()=>{
    const methodMap=(m,tr)=>{
      // 訪視類
      if(["家訪","外訪","晤談","陪同"].includes(m)){
        return tr==="120分以上"?"訪視會談120分以上":"訪視會談1-119分";
      }
      // 電訪
      if(m==="電訪"){
        if(tr==="10-19分")return "電話10-19分";
        if(tr==="20分以上")return "電話20分以上";
        return "電話1-9分";
      }
      // 其他
      const map={簡訊:"其他",代辦:"其他",個研:"研討協條",函件:"公文或函件"};
      return map[m]||"其他";
    };
    const serviceTypeMap=(m)=>({
      家訪:"關懷服務(面談)",外訪:"關懷服務(面談)",晤談:"關懷服務(面談)",陪同:"關懷服務(面談)",
      電訪:"關懷服務(電訪)",函件:"關懷服務(郵寄)",
    }[m]||"其他");
    const locationCols=["本機構","案家","外機構","其他"];
    const methodCols=["訪視會談1-119分","訪視會談120分以上","電話1-9分","電話10-19分","電話20分以上","公文或函件","研討協條","其他"];
    const personTypes=["本人","同住家屬","親友","專業團隊","機構","鄰居","其他"];
    const serviceTypeCols=["活動資訊","物資","關懷服務(面談)","關懷服務(電訪)","關懷服務(郵寄)","其他"];

    // 完整表頭（對應原始表格所有45欄）
    const header=[
      "身分證字號","提供服務日期","案號","姓名","性別","主責社工",
      "個案等級異動前","個案等級異動後","重複派案","開案新增","開案舊有","開案結案",
      "服務類型短期","服務類型輔導","服務類型追蹤",
      ...methodCols.map(c=>"服務方式"+c),
      ...locationCols.map(c=>"服務地點"+c),
      ...personTypes.map(c=>"聯繫對象"+c),
      "撰寫個案紀錄初評表","撰寫個案紀錄個摘表","撰寫個案紀錄需求評估","撰寫個案紀錄個案紀錄",
      ...serviceTypeCols.map(c=>"提供服務種類"+c),
      "提供內容說明"
    ];

    const recs=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr))
      .sort((a,b)=>(a.date||"")>(b.date||"")?1:-1);

    const rows=[header];
    recs.forEach(r=>{
      const c=data.cases.find(x=>x.id===r.caseId);
      const method=methodMap(r.contactMethod||"",r.timeRange||"");
      const svcType=serviceTypeMap(r.contactMethod||"");
      const loc=r.serviceLocation||"";
      const persons=(r.contactPersons||[]).map(p=>p.type);
      if(persons.length===0&&r.contactPersonType)persons.push(r.contactPersonType);

      rows.push([
        c?.idNo||"",       // 身分證字號
        (()=>{const d=r.date||"";if(!d)return"";const[y,m,day]=d.split("-");return{t:"d",v:new Date(parseInt(y),parseInt(m)-1,parseInt(day))};})(),
        "",                // 案號（公式自動帶入）
        "",                // 姓名（公式自動帶入）
        "",                // 性別
        "莊子昂",           // 主責社工
        null,null,null,null,null,null, // 個案等級異動前後、派案、開案
        null,null,null,          // 服務類型
        ...methodCols.map(col=>col===method?1:null),
        ...locationCols.map(col=>col===loc?1:null),
        ...personTypes.map(pt=>persons.includes(pt)?1:null),
        null,null,null,          // 撰寫個案紀錄：初評表、個摘表、需求評估
        1,               // 撰寫個案紀錄：個案紀錄
        ...serviceTypeCols.map(col=>col===svcType?1:null),
        r.content||""      // 提供內容說明
      ]);
    });

    const ws=XLSX.utils.aoa_to_sheet(rows);
    // 明確將所有數字1的儲存格設為整數型態，避免Excel資料驗證警告
    Object.keys(ws).filter(k=>!k.startsWith("!")).forEach(addr=>{
      const cell=ws[addr];
      if(cell&&cell.t==="n"&&cell.v===1){cell.t="n";cell.v=1;cell.z="0";}
    });
    ws["!cols"]=[
      {wch:14},{wch:14},{wch:10},{wch:10},{wch:6},{wch:10},
      {wch:8},{wch:8},{wch:6},{wch:6},{wch:6},{wch:6},
      {wch:6},{wch:6},{wch:6},
      ...methodCols.map(()=>({wch:8})),
      ...locationCols.map(()=>({wch:8})),
      ...personTypes.map(()=>({wch:8})),
      {wch:6},{wch:6},{wch:6},{wch:8},
      ...serviceTypeCols.map(()=>({wch:10})),
      {wch:50}
    ];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"月報表");
    XLSX.writeFile(wb,`政府月報表_民${rocYear}年${MONTH_NAMES[month-1]}.xlsx`);
  };

  // ── 匯出服務量統計（依等級分工作表）──────────────────────────
  const exportServiceStats=()=>{
    // 本月聯繫紀錄
    const monthRecs=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr));
    // 等級對應聯繫紀錄
    const levels=["一","二","三","四"];
    const wb=XLSX.utils.book_new();

    levels.forEach(lv=>{
      // 屬於該等級的個案（用 changeLevel）
      const levelCases=(data.cases||[]).filter(c=>{
        const cl=(c.changeLevel||"").toString();
        return cl.includes(lv);
      });
      const levelCaseIds=new Set(levelCases.map(c=>c.id));

      // 四級要分開：一般四級 vs 列管中心案
      let groups;
      if(lv==="四"){
        groups=[
          {label:"第四級",filter:c=>c.status!=="列管中"},
          {label:"列管中心案",filter:c=>c.status==="列管中"}
        ];
      }else{
        groups=[{label:"第"+lv+"級",filter:()=>true}];
      }

      const rows=[];
      rows.push(["服務類別","男人數","男人次","女人數","女人次","總人數","總人次"]);

      groups.forEach(g=>{
        const groupCases=levelCases.filter(g.filter);
        const groupCaseIds=new Set(groupCases.map(c=>c.id));
        const groupRecs=monthRecs.filter(r=>groupCaseIds.has(r.caseId));

        // 男
        const maleIds=new Set();
        let maleTimes=0;
        groupRecs.forEach(r=>{
          const c=groupCases.find(x=>x.id===r.caseId);
          if(c?.gender==="男"){
            maleIds.add(r.caseId);
            maleTimes+=parseInt(r.serviceCount||1);
          }
        });
        // 女
        const femaleIds=new Set();
        let femaleTimes=0;
        groupRecs.forEach(r=>{
          const c=groupCases.find(x=>x.id===r.caseId);
          if(c?.gender==="女"){
            femaleIds.add(r.caseId);
            femaleTimes+=parseInt(r.serviceCount||1);
          }
        });

        rows.push([
          g.label,
          maleIds.size,maleTimes,
          femaleIds.size,femaleTimes,
          maleIds.size+femaleIds.size,
          maleTimes+femaleTimes
        ]);
      });

      // 加個別個案明細
      rows.push([]);
      rows.push(["個案明細"]);
      rows.push(["個案姓名","案號","性別","狀態","男人數","男人次","女人數","女人次"]);
      levelCases.forEach(c=>{
        const caseRecs=monthRecs.filter(r=>r.caseId===c.id);
        if(caseRecs.length===0)return;
        const times=caseRecs.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
        const isMale=c.gender==="男";
        rows.push([
          c.name||"",
          c.caseNo||"",
          c.gender||"",
          c.status||"",
          isMale?1:0,
          isMale?times:0,
          !isMale?1:0,
          !isMale?times:0
        ]);
      });

      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"]=[{wch:16},{wch:12},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
      XLSX.utils.book_append_sheet(wb,ws,"第"+lv+"級");
    });

    XLSX.writeFile(wb,`服務量統計_民${rocYear}年${MONTH_NAMES[month-1]}.xlsx`);
  };

  const [editRec,setEditRec]=useState({});
  const fldEdit=(k,v)=>setEditRec(r=>({...r,[k]:v}));

  const handleSave=async()=>{
    const updated={...editRec,lastModified:toDay()};
    setData(d=>({...d,caseRecords:(d.caseRecords||[]).map(r=>r.id===editId?updated:r)}));
    await onSave("caseRecords",updated);
    setEditId(null);
  };

  // 服務量檢查明細（簡化計算）
  const checkGroups=[];
  const uncategorized={items:[],count:0};
  if(showCheck){
    const levels=["一","二","三","四"];
    const monthRecords=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr));

    // 找出本月有服務但無法分類（無現在等級）的個案
    const uncatCaseIds=new Set();
    monthRecords.forEach(r=>{
      const c=(data.cases||[]).find(x=>x.id===r.caseId);
      if(!c)return;
      const lv=(c.changeLevel||"").toString();
      if(!lv.includes("一")&&!lv.includes("二")&&!lv.includes("三")&&!lv.includes("四")){
        uncatCaseIds.add(c.id);
      }
    });
    uncatCaseIds.forEach(cid=>{
      const c=(data.cases||[]).find(x=>x.id===cid);
      if(!c)return;
      const caseRecs=monthRecords.filter(r=>r.caseId===c.id);
      const times=caseRecs.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
      uncategorized.items.push({name:c.name,caseNo:c.caseNo,gender:c.gender,status:c.status,changeLevel:c.changeLevel,count:caseRecs.length,times});
    });

    levels.forEach(lv=>{
      // 等級分組：排除待評估
      const levelCases=(data.cases||[]).filter(c=>(c.changeLevel||"").toString().includes(lv)&&c.status!=="待評估");
      const subGroups=lv==="四"
        ?[{label:"第四級（不含列管）",cases:levelCases.filter(c=>c.status!=="列管中")},
          {label:"列管中心案",cases:levelCases.filter(c=>c.status==="列管中")}]
        :[{label:"第"+lv+"級",cases:levelCases}];
      subGroups.forEach(g=>{
        const items=[];
        let maleP=0,femaleP=0,maleT=0,femaleT=0;
        g.cases.forEach(c=>{
          const caseRecs=monthRecords.filter(r=>r.caseId===c.id);
          if(caseRecs.length===0)return;
          const times=caseRecs.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
          items.push({name:c.name,caseNo:c.caseNo,gender:c.gender,status:c.status,count:caseRecs.length,times});
          if(c.gender==="男"){maleP++;maleT+=times;}
          else if(c.gender==="女"){femaleP++;femaleT+=times;}
        });
        checkGroups.push({label:g.label,items,maleP,femaleP,maleT,femaleT});
      });
    });
    // 待評估獨立區塊（不分等級）
    const pendingCases=(data.cases||[]).filter(c=>c.status==="待評估");
    const pendingItems=[];
    let pMaleP=0,pFemaleP=0,pMaleT=0,pFemaleT=0;
    pendingCases.forEach(c=>{
      const caseRecs=monthRecords.filter(r=>r.caseId===c.id);
      if(caseRecs.length===0)return;
      const times=caseRecs.reduce((s,r)=>s+parseInt(r.serviceCount||1),0);
      pendingItems.push({name:c.name,caseNo:c.caseNo,gender:c.gender,status:c.status,count:caseRecs.length,times});
      if(c.gender==="男"){pMaleP++;pMaleT+=times;}
      else if(c.gender==="女"){pFemaleP++;pFemaleT+=times;}
    });
    if(pendingItems.length>0||pendingCases.length>0){
      checkGroups.push({label:"待評估",items:pendingItems,maleP:pMaleP,femaleP:pFemaleP,maleT:pMaleT,femaleT:pFemaleT});
    }
  }

  // 本月等級異動清單
  const monthLevelChanges=[];
  if(showCheck){
    const histInMonth=(data.levelHistory||[]).filter(h=>h.date?.startsWith(monthStr));
    histInMonth.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    histInMonth.forEach(h=>{
      const c=(data.cases||[]).find(x=>x.id===h.caseId);
      monthLevelChanges.push({
        id:h.id,
        date:h.date,
        caseName:c?.name||h.caseName||"（未知）",
        caseNo:c?.caseNo||"",
        field:h.field,
        from:h.from,
        to:h.to,
        note:h.note,
        auto:h.auto
      });
    });
  }

  // 家訪統計（服務地點=案家）
  const homeVisitStats={lv1:{cases:new Set(),times:0},lv2:{cases:new Set(),times:0},lv3:{cases:new Set(),times:0},lv4:{cases:new Set(),times:0},items:[]};
  if(showHomeVisit){
    const monthRecords=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr)&&r.serviceLocation==="案家");
    monthRecords.forEach(r=>{
      const c=(data.cases||[]).find(x=>x.id===r.caseId);
      if(!c)return;
      const lv=(c.changeLevel||"").toString();
      const times=parseInt(r.serviceCount||1);
      let lvKey=null;
      if(lv.includes("一"))lvKey="lv1";
      else if(lv.includes("二"))lvKey="lv2";
      else if(lv.includes("三"))lvKey="lv3";
      else if(lv.includes("四"))lvKey="lv4";
      if(lvKey){
        homeVisitStats[lvKey].cases.add(c.id);
        homeVisitStats[lvKey].times+=times;
      }
      // 明細
      const existItem=homeVisitStats.items.find(x=>x.caseId===c.id);
      if(existItem){
        existItem.count++;
        existItem.times+=times;
      }else{
        homeVisitStats.items.push({caseId:c.id,name:c.name,caseNo:c.caseNo,changeLevel:c.changeLevel,count:1,times});
      }
    });
  }

  // 資源聯繫統計（聯繫對象=機構 或 專業團隊）
  const resourceItems=[];
  const rawResourceRows=[];
  if(showResources){
    const monthRecords=(data.caseRecords||[]).filter(r=>r.date?.startsWith(monthStr));
    monthRecords.forEach(r=>{
      const persons=r.contactPersons||[];
      // 抓出該紀錄中所有「機構」「專業團隊」類型的對象
      const resourcePersons=persons.filter(p=>p.type==="機構"||p.type==="專業團隊");
      // 相容舊資料 contactPersonType
      if(resourcePersons.length===0&&(r.contactPersonType==="機構"||r.contactPersonType==="專業團隊")){
        resourcePersons.push({type:r.contactPersonType,name:r.contactPerson||""});
      }
      if(resourcePersons.length===0)return;
      const c=(data.cases||[]).find(x=>x.id===r.caseId);
      if(!c)return;
      // 每個資源對象都算一筆
      resourcePersons.forEach(p=>{
        const unitName=(p.name?`${p.type} ${p.name}`:p.type).trim().replace(/\s+/g," ");
        rawResourceRows.push({
          caseId:c.id,
          name:c.name||"",
          changeLevel:c.changeLevel||"",
          unit:unitName,
          content:r.content||"",
          date:r.date||"",
          contactCount:parseInt(r.contactCount||1)
        });
      });
    });

    // ── 依「個案 + 資源單位」分組合併（政府表要求當月同一資源填同一筆）──
    const groupMap=new Map();
    rawResourceRows.forEach(row=>{
      const key=row.caseId+"||"+row.unit;
      if(!groupMap.has(key)){
        groupMap.set(key,{
          caseId:row.caseId,
          name:row.name,
          changeLevel:row.changeLevel,
          unit:row.unit,
          contactCount:0,
          details:[]
        });
      }
      const g=groupMap.get(key);
      g.contactCount+=row.contactCount;
      g.details.push({date:row.date,content:row.content,count:row.contactCount});
    });
    groupMap.forEach(g=>{
      g.details.sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
      // 聯繫原因統整：去除完全重複的內容，其餘串接
      g.mergedContent=[...new Set(g.details.map(d=>(d.content||"").trim()).filter(Boolean))].join("、");
      resourceItems.push(g);
    });
    // 同一資源單位排在一起，同單位內再按姓名排序
    resourceItems.sort((a,b)=>{
      const u=(a.unit||"").localeCompare(b.unit||"","zh-TW");
      return u!==0?u:(a.name||"").localeCompare(b.name||"","zh-TW");
    });
  }

  // ── 資源聯繫：對應總冊、評價草稿、下載紀錄表 ──
  const rbRowKey=it=>it.caseId+"||"+it.unit;
  const rbMaps=(data.resourceMap||[]).filter(m=>m.kind==="map");
  const rbNewEntries=(data.resourceMap||[]).filter(m=>m.kind==="new");
  // 先找這個個案自己的對應，沒有就沿用其他個案對同一單位最近一次的對應
  const rbGetMap=it=>{
    const own=rbMaps.find(m=>m.caseId===it.caseId&&m.unit===it.unit);
    if(own)return{m:own,inherited:false};
    const other=rbMaps.filter(m=>m.unit===it.unit).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0];
    return other?{m:other,inherited:true}:null;
  };
  // state：ok 總冊有、new 新增待貼、unverified 總冊未載入、missing 總冊找不到、none 未對應
  const rbResolve=m=>{
    if(!m)return{state:"none"};
    const k=rbKey(m.name,m.big,m.sub);
    if(rbBook){const e=rbIndex.get(k);if(e)return{state:"ok",entry:e};}
    const ne=rbNewEntries.find(n=>rbKey(n.name,n.big,n.sub)===k);
    if(ne)return{state:"new",entry:ne};
    return{state:rbBook?"missing":"unverified",entry:m};
  };
  const rbRows=resourceItems.map(it=>{const mp=rbGetMap(it);return{it,mp,rs:rbResolve(mp?.m)};});
  const rbDone=rbRows.filter(r=>r.rs.state==="ok"||r.rs.state==="new"||r.rs.state==="unverified").length;
  const rbPendingNew=rbBook
    ?rbNewEntries.filter(n=>!rbIndex.has(rbKey(n.name,n.big,n.sub)))
    :rbNewEntries.filter(n=>rbRows.some(r=>r.rs.state==="new"&&r.rs.entry.id===n.id));
  const rbSavePick=async(it,e)=>{
    const own=rbMaps.find(m=>m.caseId===it.caseId&&m.unit===it.unit);
    const rec={id:own?.id||uid(),kind:"map",caseId:it.caseId,unit:it.unit,name:e.name,big:e.big,sub:e.sub,updatedAt:new Date().toISOString()};
    setData(d=>({...d,resourceMap:[...(d.resourceMap||[]).filter(x=>x.id!==rec.id),rec]}));
    await onSave("resourceMap",rec);
  };
  const rbCreateNew=async fields=>{
    const rec={id:uid(),kind:"new",cat:fields.cat,name:fields.name,big:fields.big,sub:fields.sub,desc:fields.desc,legal:fields.legal,form:fields.form,url:fields.url,createdAt:toDay()};
    setData(d=>({...d,resourceMap:[...(d.resourceMap||[]),rec]}));
    await onSave("resourceMap",rec);
    return rec;
  };
  const rbDeleteNew=async id=>{
    setData(d=>({...d,resourceMap:(d.resourceMap||[]).filter(x=>x.id!==id)}));
    if(onDelete)await onDelete("resourceMap",id);
  };
  const rbCaseType=c=>{
    if(!c)return"";
    if(c.status==="待評估")return"開案評估期";
    const s=String(c.changeLevel||"");
    const LV=[["一",1],["二",2],["三",3],["四",4],["1",1],["2",2],["3",3],["4",4]];
    const hit=LV.find(([k])=>s.includes(k));
    return hit?hit[1]:"";
  };
  const exportResourceTable=()=>{
    const XL=window.XLSX;
    const uniq=a=>[...new Set(a.map(x=>String(x||"").trim()).filter(Boolean))];
    // 同一個案對到同一筆總冊資源的列合併成一列
    const groups=new Map();
    rbRows.forEach(({it,mp,rs})=>{
      const ent=rs.entry;
      const k=it.caseId+"##"+(ent?rbKey(ent.name,ent.big,ent.sub):"none:"+it.unit);
      const dr=rbDraft[rbRowKey(it)]||{};
      if(!groups.has(k))groups.set(k,{c:(data.cases||[]).find(x=>x.id===it.caseId),it,ent,rs,inherited:!!mp?.inherited,count:0,contents:[],ev:new Set(),notes:[],units:[],details:[]});
      const g=groups.get(k);
      g.count+=it.contactCount||0;
      g.contents.push(dr.content??it.mergedContent);
      (dr.ev||[]).forEach(x=>g.ev.add(x));
      g.notes.push(dr.note);
      g.units.push(it.unit);
      g.details.push(...(it.details||[]));
    });
    const list=[...groups.values()];
    const worker=c=>userName||c?.mainWorker||"";
    // 工作表一：跟資源聯繫紀錄表同 19 欄
    const main=[RC_HEAD];
    list.forEach(g=>{
      main.push([
        rbCaseType(g.c),g.c?.name||g.it.name,
        g.ent?.name||"",g.ent?.big||"",g.ent?.sub||"",
        uniq(g.contents).join("、"),month,g.count,
        ...RB_EVALS.map((_,i)=>g.ev.has(i)?1:""),
        uniq(g.notes).join("、"),worker(g.c)
      ]);
    });
    const ws1=XL.utils.aoa_to_sheet(main);
    ws1["!cols"]=[8,10,36,18,22,40,8,8,10,10,10,10,10,10,10,10,10,16,8].map(w=>({wch:w}));
    // 工作表二：核對用
    const ST={ok:"已對應",new:"新增資源，要先貼進總冊",unverified:"沒有載入總冊，未核對",missing:"總冊找不到這筆，請重選",none:"未對應，資源名稱空白"};
    const chk=[["狀態","個案","個案類型","系統內資源單位","總冊資源名稱","大類","小項","次數","聯繫明細"]];
    list.forEach(g=>{
      const flags=[ST[g.rs.state]];
      if(g.inherited)flags.push("沿用其他個案的對應");
      if(uniq(g.units).length>1)flags.push("合併了 "+uniq(g.units).length+" 種單位寫法");
      if(rbCaseType(g.c)==="")flags.push("個案類型空白");
      const det=[...g.details].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(d=>`${fmtDate(d.date)}${d.count>1?" ×"+d.count:""} ${d.content||""}`.trim());
      chk.push([flags.join("、"),g.c?.name||g.it.name,rbCaseType(g.c),uniq(g.units).join("、"),g.ent?.name||"",g.ent?.big||"",g.ent?.sub||"",g.count,det.join("\n")]);
    });
    const ws2=XL.utils.aoa_to_sheet(chk);
    ws2["!cols"]=[28,10,8,26,36,18,22,6,60].map(w=>({wch:w}));
    const wb=XL.utils.book_new();
    XL.utils.book_append_sheet(wb,ws1,"資源聯繫紀錄表");
    XL.utils.book_append_sheet(wb,ws2,"核對用");
    // 工作表三：新增至總冊，照總冊 A 到 J 欄順序
    if(rbPendingNew.length>0){
      const head=rbBook?.head?.length===10?rbBook.head:RB_DEFAULT_HEAD;
      const roles=rbBook?.colRoles?.length===10?rbBook.colRoles:RB_ROLE_ORDER;
      const rows=[head];
      rbPendingNew.forEach(n=>rows.push(roles.map(r=>r==="created"||r==="updated"?"":r?(n[r]||""):"")));
      const ws3=XL.utils.aoa_to_sheet(rows);
      rbPendingNew.forEach((n,i)=>{
        roles.forEach((r,ci)=>{
          if(r!=="created"&&r!=="updated")return;
          const v=rbSerial(n.createdAt||toDay());
          if(v!==null)ws3[XL.utils.encode_cell({r:i+1,c:ci})]={t:"n",v,z:"yyyy/m/d"};
        });
      });
      ws3["!cols"]=[10,36,18,22,40,14,6,24,12,12].map(w=>({wch:w}));
      XL.utils.book_append_sheet(wb,ws3,"新增至總冊");
    }
    XL.writeFile(wb,`資源聯繫紀錄表_民${rocYear}年${month}月.xlsx`);
  };
  const rbMapCell=(it,row)=>{
    const {mp,rs}=row;
    const small={fontSize:11,color:C.muted,marginTop:2};
    const linkBtn=(txt,onClick,color="#3A5FAA")=><button onClick={onClick} style={{border:"none",background:"transparent",padding:0,marginRight:10,fontSize:11,fontWeight:600,color,cursor:"pointer",fontFamily:font}}>{txt}</button>;
    const openPick=()=>setRbPicker({mode:"pick",it});
    if(rs.state==="none")return rbBook
      ?<button onClick={openPick} style={{padding:"4px 12px",borderRadius:6,border:"1px solid #4A78B0",background:"#fff",color:"#3A5FAA",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:font}}>選擇</button>
      :<span style={{fontSize:12,color:C.muted}}>未對應・先載入總冊</span>;
    const e=rs.entry;
    const tag={new:["新增待貼總冊","#FFF4E0",C.accent],unverified:["未核對總冊","#F0F0EE",C.muted],missing:["總冊找不到，請重選","#FFE0E0","#A03030"]}[rs.state];
    return(
      <div>
        <div style={{fontSize:12,fontWeight:600,color:rs.state==="missing"?"#A03030":C.text,lineHeight:1.5,wordBreak:"break-word"}}>{rbOneLine(e.name)}</div>
        <div style={small}>{rbOneLine(e.sub)}</div>
        {tag&&<div style={{marginTop:3}}><span style={{fontSize:10,fontWeight:600,padding:"1px 7px",borderRadius:20,background:tag[1],color:tag[2]}}>{tag[0]}</span></div>}
        <div style={{marginTop:4}}>
          {mp?.inherited&&<span style={{fontSize:11,color:C.accent,marginRight:8}}>沿用其他個案</span>}
          {mp?.inherited&&rs.state!=="missing"&&linkBtn("✓ 確認",()=>rbSavePick(it,e),C.primary)}
          {rbBook&&linkBtn("更換",openPick)}
        </div>
      </div>
    );
  };
  const rbEditorRow=it=>{
    const k=rbRowKey(it);
    const dr=rbDraft[k]||{};
    const ev=dr.ev||[];
    return(
      <tr style={{background:"#F5F9FF",borderBottom:`1px solid ${C.border}`}}>
        <td colSpan={6} style={{padding:"10px 14px 14px"}}>
          <div style={{fontSize:12,fontWeight:700,color:"#3A5FAA",marginBottom:6}}>下載用內容　只存在這台電腦的瀏覽器</div>
          <Label>聯繫內容說明</Label>
          <textarea value={dr.content??it.mergedContent??""} onChange={e=>rbUpdDraft(k,{content:e.target.value})} rows={3} style={inp({fontSize:13,lineHeight:1.7,resize:"vertical"})}/>
          {dr.content!==undefined&&dr.content!==it.mergedContent&&<button onClick={()=>rbUpdDraft(k,{content:undefined})} style={{border:"none",background:"transparent",padding:0,fontSize:11,color:"#3A5FAA",cursor:"pointer",marginTop:2,fontFamily:font}}>還原成系統統整的文字</button>}
          <div style={{marginTop:10}}><Label>評價　無則免填，勾選的欄位下載時填 1</Label></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:"4px 12px"}}>
            {RB_EVALS.map((lbl,i)=>(
              <label key={i} style={{fontSize:12,color:C.text,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" checked={ev.includes(i)} onChange={e=>rbUpdDraft(k,{ev:e.target.checked?[...ev,i].sort((a,b)=>a-b):ev.filter(x=>x!==i)})}/>
                {lbl}
              </label>
            ))}
          </div>
          <div style={{marginTop:10}}><Label>說明　有勾「9 其他」才需要填</Label></div>
          <input value={dr.note||""} onChange={e=>rbUpdDraft(k,{note:e.target.value})} style={inp({fontSize:13})}/>
        </td>
      </tr>
    );
  };

  // 篩選該月份的聯繫紀錄
  const records=(data.caseRecords||[])
    .filter(r=>r.date?.startsWith(monthStr))
    .sort((a,b)=>{if(b.date!==a.date)return(b.date||"")>(a.date||"")?1:-1;return(b.createdAt||"")>(a.createdAt||"")?1:(b.createdAt||"")<(a.createdAt||"")?-1:0;});

  // 個案名稱對照
  const caseName=id=>data.cases.find(c=>c.id===id)?.name||"（未知）";
  const caseNo=id=>data.cases.find(c=>c.id===id)?.caseNo||"";

  // 統計
  const pendingIds=new Set((data.cases||[]).filter(c=>c.status==="待評估").map(c=>c.id));
  let totalActive=0,totalPending=0;
  records.forEach(r=>{
    const v=parseInt(r.serviceCount||1);
    if(pendingIds.has(r.caseId))totalPending+=v;
    else totalActive+=v;
  });
  const totalCount=totalActive+totalPending;
  const byMethod={};
  records.forEach(r=>{
    const m=r.contactMethod||"其他";
    byMethod[m]=(byMethod[m]||0)+parseInt(r.contactCount||1);
  });
  const byCaseCount={};
  records.forEach(r=>{byCaseCount[r.caseId]=(byCaseCount[r.caseId]||0)+parseInt(r.contactCount||1);});
  const caseCount=Object.keys(byCaseCount).length;

  const prevMonth=()=>{if(month===1){setYear(y=>y-1);setMonth(12);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===12){setYear(y=>y+1);setMonth(1);}else setMonth(m=>m+1);};

  const MONTH_NAMES=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];

  return(
    <div>
      {/* 標題與月份切換 */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <h1 style={{fontSize:22,fontWeight:700,fontFamily:serif,color:C.text,margin:0}}>月服務報表</h1>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={prevMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:16}}>‹</button>
          <span style={{fontSize:15,fontWeight:700,color:C.text,minWidth:120,textAlign:"center",fontFamily:serif}}>
            民{rocYear}年 {MONTH_NAMES[month-1]}
          </span>
          <button onClick={nextMonth} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,cursor:"pointer",fontSize:16}}>›</button>

          <button onClick={exportGovTable}
            style={{padding:"7px 16px",borderRadius:8,border:"none",background:"#4A6E8A",color:"#fff",cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            📋 匯出月報表
          </button>
          <button onClick={()=>setShowCheck(v=>!v)}
            style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${showCheck?C.primary:C.border}`,background:showCheck?C.primary:"transparent",color:showCheck?"#fff":C.muted,cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            🔍 {showCheck?"隱藏檢查":"檢查計算"}
          </button>
          <button onClick={()=>setShowHomeVisit(v=>!v)}
            style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${showHomeVisit?"#C4824A":C.border}`,background:showHomeVisit?"#C4824A":"transparent",color:showHomeVisit?"#fff":C.muted,cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            📊 {showHomeVisit?"隱藏家訪":"家訪統計"}
          </button>
          <button onClick={()=>setShowResources(v=>!v)}
            style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${showResources?"#3A5FAA":C.border}`,background:showResources?"#3A5FAA":"transparent",color:showResources?"#fff":C.muted,cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            🔗 {showResources?"隱藏資源":"資源聯繫"}
          </button>
          <button onClick={()=>setShowRecon(v=>!v)}
            style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${showRecon?"#5E8A5A":C.border}`,background:showRecon?"#5E8A5A":"transparent",color:showRecon?"#fff":C.muted,cursor:"pointer",fontSize:12,fontFamily:font,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            🧾 {showRecon?"隱藏比對":"比對主管名單"}
          </button>
        </div>
      </div>

      {/* 統計摘要 */}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[
          {label:"聯繫紀錄筆數",val:records.length,color:C.primary},
          {label:"服務人次",val:totalCount,sub:totalPending>0?`開案 ${totalActive} + 待評估 ${totalPending}`:null,color:C.accent},
          {label:"服務個案數",val:caseCount,color:"#4A6E8A"},
        ].map(({label,val,color,sub})=>(
          <div key={label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"16px 20px",flex:1,minWidth:100}}>
            <div style={{fontSize:28,fontWeight:700,color,fontFamily:serif}}>{val}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:4}}>{label}</div>
            {sub&&<div style={{fontSize:11,color:C.muted,marginTop:2,fontWeight:500}}>{sub}</div>}
          </div>
        ))}
      </div>

      {showRecon&&<CaseReconcile data={data} setData={setData} onSave={onSave} userName={userName}/>}

      {/* 家訪統計面板 */}
      {showHomeVisit&&(
        <div style={{background:"#FFF5EB",border:"2px solid #C4824A",borderRadius:12,padding:20,marginBottom:20}}>
          <div style={{fontSize:15,fontWeight:700,color:"#7A4A20",marginBottom:16}}>📊 家訪統計（服務地點＝案家）</div>
          <div style={{background:C.card,borderRadius:8,overflow:"hidden",border:`1px solid ${C.border}`,marginBottom:12}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{background:"#FFE0C5"}}>
                  <th style={{padding:"8px 12px",textAlign:"left",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>項目</th>
                  <th style={{padding:"8px 12px",textAlign:"center",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>1級</th>
                  <th style={{padding:"8px 12px",textAlign:"center",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>2級</th>
                  <th style={{padding:"8px 12px",textAlign:"center",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>3級</th>
                  <th style={{padding:"8px 12px",textAlign:"center",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>4級</th>
                  <th style={{padding:"8px 12px",textAlign:"center",color:"#7A4A20",fontWeight:700,borderBottom:`1px solid ${C.border}`}}>合計</th>
                </tr>
              </thead>
              <tbody>
                <tr style={{borderBottom:`1px solid ${C.border}`}}>
